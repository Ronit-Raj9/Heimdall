# Bifrost Bench gateway stack, graduated from bench/spike/compose.yaml
# (docs/spike.md). Run from bench/:
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   CGO_ENABLED=0 GOWORK=off go build -o bin/bifrost-bench ./cmd/bifrost-bench
#   docker build -t bench/bifrost-bench:dev .
#   docker compose -f deploy/docker-compose.yml up -d --wait
#
# Networks:
#   bench-evalnet   internal, IPv6 off. Agent containers attach here and can
#                   reach only Bifrost (http://bifrost:8080).
#   bench-upstream  normal bridge. Bifrost reaches Postgres and the fault
#                   proxy here; the fault proxy reaches the real provider.
# Agent -> Bifrost -> fault proxy (http://faultproxy:9100) -> provider. The
# real provider keys live only in the fault proxy (proxied providers); a
# provider the bench runs in direct mode gets its key from the bench process. Bifrost (18080) and the
# proxy control API (19101) are published on loopback only.
#
# Secrets come from deploy/.env (see .env.example). Unset values interpolate
# empty so `docker compose config` validates without them, and every service
# then fails closed: Postgres refuses to initialise without a password,
# Bifrost answers 403 on every /api call without a setup token, and the proxy
# generates a control token nobody else knows.
#
# Third-party images are pinned by digest (tag kept for reading) to the bits
# the bench was tested with. The fault proxy image is built locally by
# `make images`, so it stays on its tag: a digest there would go stale on
# every rebuild.
name: bifrost-bench

x-labels: &labels
  bifrost-bench: "1"

networks:
  evalnet:
    name: bench-evalnet
    internal: true
    enable_ipv6: false
    labels: *labels
  upstream:
    name: bench-upstream
    enable_ipv6: false
    labels: *labels

volumes:
  pgdata:
    labels: *labels
  bifrost-data:
    labels: *labels
  ledger:
    labels: *labels

services:
  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    labels: *labels
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: ${BIFROST_PG_PASSWORD:-}
      POSTGRES_DB: bifrost
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [upstream]
    # Over TCP on purpose: the image's entrypoint runs a temporary init server
    # on the Unix socket only, so a socket check can pass before the real
    # server is up and Bifrost then fails its first connection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U bifrost -d bifrost"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The bench binary's proxy subcommand (package bench/faultproxy). The
  # BENCH_FAULTPROXY_* names follow bench.yaml's BENCH_<SECTION>_<KEY>
  # override rule. The control API listens on all interfaces inside the
  # container so the loopback-only port mapping below can reach it.
  faultproxy:
    image: bench/bifrost-bench:dev
    labels: *labels
    command: ["proxy", "--config", "/etc/bench/bench.yaml", "--slots", "fp-slot-1,fp-slot-2,fp-slot-3,fp-slot-4,fp-slot-5,fp-slot-6,fp-slot-7,fp-slot-8"] # keep in step with gateway.key_slots in bench.yaml
    environment:
      BENCH_FAULTPROXY_TOKEN: ${BENCH_FAULTPROXY_TOKEN:-}
      BENCH_FAULTPROXY_LISTEN: ":9100"
      BENCH_FAULTPROXY_CONTROL_LISTEN: "0.0.0.0:9101"
      BENCH_FAULTPROXY_LEDGER: /var/lib/bench/ledger/ledger.jsonl
      # Optional provider table file (faultproxy.LoadProviders), mounted
      # below when used; empty keeps the built-in table.
      BENCH_FAULTPROXY_PROVIDERS: ${BENCH_FAULTPROXY_PROVIDERS:-}
      # Real provider keys. Only the proxy sees them. A provider with an
      # empty key answers with a 503 "no key configured". Set
      # BENCH_FAULTPROXY_SCRIPTED_FALLBACK=1 for local development only: then
      # anthropic and openai answer from the scripted model instead, and those
      # runs are labelled practice and kept off report cards and leaderboards.
      BENCH_FAULTPROXY_SCRIPTED_FALLBACK: ${BENCH_FAULTPROXY_SCRIPTED_FALLBACK:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # Sarvam AI speech (saaras/bulbul models on the openai provider, faultproxy/sarvam.go).
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
    volumes:
      - ./bench.yaml:/etc/bench/bench.yaml:ro
      - ledger:/var/lib/bench/ledger
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [upstream]
    ports:
      - "127.0.0.1:19101:9101"
    restart: unless-stopped

  bifrost:
    image: maximhq/bifrost:v2.5.1@sha256:5ec9873acaf1687556b6e4dd854b92b539d9debf87a5a683b66338648b84d3c8
    labels: *labels
    environment:
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      BIFROST_PG_PASSWORD: ${BIFROST_PG_PASSWORD:-}
      LOG_STYLE: json
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
      - ./bifrost/datasheet:/app/datasheet:ro
    depends_on:
      postgres:
        condition: service_healthy
      faultproxy:
        condition: service_started
    networks: [evalnet, upstream]
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped
