# The gateway Service the agents reach (kubernetes.gateway_url): read only,
# in the gateway namespace only. `k8s gateway up|down` needs write access
# here (services, deployments); run those as an administrator or grant it
# separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-bench-gateway-read
  namespace: heimdall-gw
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-bench-gateway-read
  namespace: heimdall-gw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-bench-gateway-read
subjects:
  - kind: ServiceAccount
    name: heimdall-bench
    namespace: heimdall-system
---
# The only cluster-scoped grant, all read-only or self-review:
# - nodes get/list: the driver checks that the node a run pod landed on has
#   the frozen agent image digest and reads its architecture (Lock
#   fingerprints), and `k8s check` lists the images on the nodes.
# - selfsubjectaccessreviews create: `k8s check` asks which verbs it holds
#   (most clusters already grant this to every authenticated user).
# - runtimeclasses get: `k8s check` verifies kubernetes.runtime_class exists.
# The egress probe also tries to read the kube-dns and kubernetes Services
# for extra forbidden targets; without access it skips those targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heimdall-bench-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heimdall-bench-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heimdall-bench-cluster-read
subjects:
  - kind: ServiceAccount
    name: heimdall-bench
    namespace: heimdall-system
