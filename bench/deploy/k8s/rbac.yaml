# What the Kubernetes driver needs when the bench runs inside the cluster
# with a service account (docs/kubernetes.md, "Namespace pool"). This is the
# default: namespace-scoped. The driver runs in namespace pool mode
# (kubernetes.namespaces: [heimdall-run-1, ..., heimdall-run-4]); it never
# creates or deletes a namespace, and every permission that touches run pods
# (secrets, pods/exec) is a Role inside a pool namespace, which holds only
# run pods. There are no cluster-wide secrets and no namespace delete.
#
#   kubectl apply -f deploy/k8s/rbac.yaml
#
# `bifrost-bench k8s check` asks the API server for each verb in each pool
# namespace and names any that is denied. The legacy per-run-namespace mode
# needs deploy/k8s/rbac-cluster.yaml instead.
#
# The run pods themselves get no permissions at all: their service account
# token is never mounted (automountServiceAccountToken: false).
apiVersion: v1
kind: Namespace
metadata:
  name: heimdall-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall-bench
  namespace: heimdall-system
---
# Pool namespace: one run at a time, leased by the run's anchor config map.
apiVersion: v1
kind: Namespace
metadata:
  name: heimdall-run-1
  labels:
    heimdall.run: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-bench-run
  namespace: heimdall-run-1
rules:
  # The run pod, its env secret, its anchor (the lease) and observer
  # scripts, and the tokenless kubernetes.service_account.
  - apiGroups: [""]
    resources: [pods, secrets, configmaps, serviceaccounts]
    verbs: [create, get, list, delete]
  # Seeding, export, observers and the agent's own streams; only run pods
  # live here, so exec reaches nothing else.
  - apiGroups: [""]
    resources: [pods/exec, pods/attach]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-bench-run
  namespace: heimdall-run-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-bench-run
subjects:
  - kind: ServiceAccount
    name: heimdall-bench
    namespace: heimdall-system
---
