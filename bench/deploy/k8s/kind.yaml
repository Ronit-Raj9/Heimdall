# A local kind cluster for the Kubernetes driver (docs/kubernetes.md).
#
#   kind create cluster --config deploy/k8s/kind.yaml --kubeconfig <file>
#
# The API server and the two NodePorts that `k8s gateway up -node-ports`
# opens are published on loopback only: 18381 is Bifrost (the bench's
# gateway.url), 18382 the fault proxy's control API (faultproxy.control_url).
# Change the cluster name and host ports when they clash with another
# cluster on the same machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hd-x3
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18381
        listenAddress: "127.0.0.1"
      - containerPort: 30091
        hostPort: 18382
        listenAddress: "127.0.0.1"
