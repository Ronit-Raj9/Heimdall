# Bifrost Bench configuration. Relative paths resolve against the bench root,
# the parent of this deploy/ folder. Every key can be overridden with an
# environment variable named BENCH_<SECTION>_<KEY> (top-level keys:
# BENCH_<KEY>), for example BENCH_SERVER_MODE=recorded. List values in the
# environment are comma-separated.
runs_root: runs
benchmarks_root: benchmarks
pricing: deploy/pricing-snapshot.json

server:
  # Loopback only. The write token guards POST routes as the second defence.
  listen: 127.0.0.1:8090
  # live | recorded | synthetic. Every API response carries it.
  mode: live
  # Extra Host header values accepted besides loopback names (DNS rebinding guard).
  allowed_hosts: []
  # Origins allowed to call the API from a browser. Empty keeps CORS off.
  cors_origins: []

gateway:
  url: http://127.0.0.1:18080        # host side
  agent_url: http://bifrost:8080     # from inside the evaluation network
  admin_token_env: BIFROST_SETUP_TOKEN
  provider: anthropic
  # Runs that may use one provider at once: fp-slot-1..N (anthropic) and
  # oa-slot-1..N (openai). Keep it equal to the proxy --slots-per-provider in
  # docker-compose.yml. A team of N members holds N slots.
  slots_per_provider: 24

faultproxy:
  control_url: http://127.0.0.1:19101

networks:
  eval: bench-evalnet

images:
  helper: bench/coding-core-base:1
