      - record: slo:sli_error:ratio_rate1d
        expr: |
          ((sum(rate(heimdall_remote_complete_seconds_count[1d])) - sum(rate(heimdall_remote_complete_seconds_bucket{le="30"}[1d]))) / (sum(rate(heimdall_remote_complete_seconds_count[1d]))))
        labels:
          sloth_service: heimdall
          sloth_slo: time-to-verdict-step
          sloth_window: 1d
      - record: slo:sli_error:ratio_rate3d
        expr: |
          ((sum(rate(heimdall_remote_complete_seconds_count[3d])) - sum(rate(heimdall_remote_complete_seconds_bucket{le="30"}[3d]))) / (sum(rate(heimdall_remote_complete_seconds_count[3d]))))
        labels:
          sloth_service: heimdall
          sloth_slo: time-to-verdict-step
          sloth_window: 3d
  - name: sloth-slo-meta-recordings-heimdall-time-to-verdict-step
    rules:
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {sloth_service: heimdall, sloth_slo: time-to-verdict-step}
      - record: slo:error_budget:ratio
        expr: vector(0.01)
        labels: {sloth_service: heimdall, sloth_slo: time-to-verdict-step}
      - record: slo:period_error_budget_remaining:ratio
        expr: 1 - (avg_over_time(slo:sli_error:ratio_rate5m{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}[30d]) / 0.01)
        labels: {sloth_service: heimdall, sloth_slo: time-to-verdict-step}
  - name: sloth-slo-alerts-heimdall-time-to-verdict-step
    rules:
      - alert: HeimdallSealLatency
        expr: |
          (max(slo:sli_error:ratio_rate1h{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (14.4 * 0.01) and max(slo:sli_error:ratio_rate5m{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (14.4 * 0.01))
          or
          (max(slo:sli_error:ratio_rate6h{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (6 * 0.01) and max(slo:sli_error:ratio_rate30m{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (6 * 0.01))
        labels:
          severity: page
          sloth_slo: time-to-verdict-step
        annotations:
          summary: "time-to-verdict-step: error budget burning fast"
          description: "Uploads the server verifies, stores and seals within 30 seconds (the step between a finished run and a visible result). Objective 99% over 30 days; at this rate the budget is gone in under 2 days."
          runbook_url: "docs/monitoring.md#slo-time-to-verdict-step"
      - alert: HeimdallSealLatency
        expr: |
          (max(slo:sli_error:ratio_rate1d{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (3 * 0.01) and max(slo:sli_error:ratio_rate2h{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (3 * 0.01))
          or
          (max(slo:sli_error:ratio_rate3d{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (1 * 0.01) and max(slo:sli_error:ratio_rate6h{sloth_service="heimdall", sloth_slo="time-to-verdict-step"}) > (1 * 0.01))
        labels:
          severity: ticket
          sloth_slo: time-to-verdict-step
        annotations:
          summary: "time-to-verdict-step: error budget burning"
          description: "Uploads the server verifies, stores and seals within 30 seconds (the step between a finished run and a visible result). Objective 99% over 30 days."
          runbook_url: "docs/monitoring.md#slo-time-to-verdict-step"
