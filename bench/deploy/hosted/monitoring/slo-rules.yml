# Generated from slos.yml in the form `sloth generate` writes (lane Z14).
# Recording rules: slo:sli_error:ratio_rate<window> per SLO, then
# multiwindow multi-burn-rate alerts (Google SRE workbook, chapter 5):
#   page:   1h and 5m windows burning 14.4x, or 6h and 30m burning 6x
#   ticket: 1d and 2h windows burning 3x, or 3d and 6h burning 1x
# Do not edit by hand without editing slos.yml too.
groups:
  - name: sloth-slo-sli-recordings-heimdall-api-availability
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[5m]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[5m]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 5m
      - record: slo:sli_error:ratio_rate30m
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[30m]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[30m]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 30m
      - record: slo:sli_error:ratio_rate1h
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[1h]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[1h]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 1h
      - record: slo:sli_error:ratio_rate2h
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[2h]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[2h]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 2h
      - record: slo:sli_error:ratio_rate6h
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[6h]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[6h]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 6h
      - record: slo:sli_error:ratio_rate1d
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[1d]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[1d]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 1d
      - record: slo:sli_error:ratio_rate3d
        expr: |
          ((sum(rate(heimdall_http_request_duration_seconds_count{code="5xx",area!~"health|ui"}[3d]))) / (sum(rate(heimdall_http_request_duration_seconds_count{area!~"health|ui"}[3d]))))
        labels:
          sloth_service: heimdall
          sloth_slo: api-availability
          sloth_window: 3d
  - name: sloth-slo-meta-recordings-heimdall-api-availability
    rules:
      - record: slo:objective:ratio
        expr: vector(0.995)
        labels: {sloth_service: heimdall, sloth_slo: api-availability}
      - record: slo:error_budget:ratio
        expr: vector(0.005)
        labels: {sloth_service: heimdall, sloth_slo: api-availability}
      - record: slo:period_error_budget_remaining:ratio
        expr: 1 - (avg_over_time(slo:sli_error:ratio_rate5m{sloth_service="heimdall", sloth_slo="api-availability"}[30d]) / 0.005)
        labels: {sloth_service: heimdall, sloth_slo: api-availability}
  - name: sloth-slo-alerts-heimdall-api-availability
    rules:
      - alert: HeimdallAPIAvailability
        expr: |
          (max(slo:sli_error:ratio_rate1h{sloth_service="heimdall", sloth_slo="api-availability"}) > (14.4 * 0.005) and max(slo:sli_error:ratio_rate5m{sloth_service="heimdall", sloth_slo="api-availability"}) > (14.4 * 0.005))
          or
          (max(slo:sli_error:ratio_rate6h{sloth_service="heimdall", sloth_slo="api-availability"}) > (6 * 0.005) and max(slo:sli_error:ratio_rate30m{sloth_service="heimdall", sloth_slo="api-availability"}) > (6 * 0.005))
        labels:
          severity: page
          sloth_slo: api-availability
        annotations:
          summary: "api-availability: error budget burning fast"
          description: "API requests that do not fail with a server error (5xx). Health probes and the static site are left out. Objective 99.5% over 30 days; at this rate the budget is gone in under 2 days."
          runbook_url: "docs/monitoring.md#slo-api-availability"
      - alert: HeimdallAPIAvailability
        expr: |
          (max(slo:sli_error:ratio_rate1d{sloth_service="heimdall", sloth_slo="api-availability"}) > (3 * 0.005) and max(slo:sli_error:ratio_rate2h{sloth_service="heimdall", sloth_slo="api-availability"}) > (3 * 0.005))
          or
          (max(slo:sli_error:ratio_rate3d{sloth_service="heimdall", sloth_slo="api-availability"}) > (1 * 0.005) and max(slo:sli_error:ratio_rate6h{sloth_service="heimdall", sloth_slo="api-availability"}) > (1 * 0.005))
        labels:
          severity: ticket
          sloth_slo: api-availability
        annotations:
          summary: "api-availability: error budget burning"
          description: "API requests that do not fail with a server error (5xx). Health probes and the static site are left out. Objective 99.5% over 30 days."
          runbook_url: "docs/monitoring.md#slo-api-availability"
