# Prometheus for the hosted stack (profile monitoring, lane Z14). Scrapes
# the server's metrics address on the backend network; set
# HEIMDALL_METRICS_LISTEN=0.0.0.0:9090 in deploy/hosted/.env.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: heimdall

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml

scrape_configs:
  - job_name: heimdall
    metrics_path: /metrics
    static_configs:
      - targets: ["heimdall:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
