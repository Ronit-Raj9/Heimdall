# LiveKit server of the voice profile (docker-compose.yml, docs/voice-realtime.md).
# Keys come from LIVEKIT_KEYS (deploy/hosted/.env: LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
port: 7880
bind_addresses: [""]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Teams' agent workers join from the internet: advertise the public IP.
  use_external_ip: true
redis:
  address: voice-redis:6379
room:
  empty_timeout: 60
  departure_timeout: 20
logging:
  level: info
