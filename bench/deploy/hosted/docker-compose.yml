# Hosted Heimdall: Caddy (HTTPS) -> Heimdall server -> Postgres, plus an
# optional shared worker with its own Bifrost stack. From a fresh VM to a
# working instance: docs/hosting.md. Use the scripts beside this file rather
# than raw compose; they pass the env file and fill in derived values:
#
#   deploy/hosted/bootstrap.sh   first run: .env, build, migrate, owner
#   deploy/hosted/upgrade.sh     pull, rebuild, migrate, restart
#   deploy/hosted/registry-sync.sh  base images into the shared worker's registry
#   deploy/hosted/backup.sh      database dump and evidence mirror
#   deploy/hosted/smoke.sh       the whole stack on spare local ports, then down
#
# Raw compose, from bench/:
#
#   docker compose -f deploy/hosted/docker-compose.yml --env-file deploy/hosted/.env up -d --wait
#
# Networks:
#   edge      Caddy and the server (and the shared worker). Caddy is the
#             only service with published ports (80, 443 and 443/udp).
#   backend   internal (no route out): the server and Postgres. Postgres is
#             never published.
#   upstream  shared-runner profile only: Bifrost, its Postgres and the fault
#             proxy, which reaches the real provider.
#   buildnet  shared-runner profile only (fixed name heimdall-buildnet): the
#             read-only image registry, the shared worker and its image
#             build sessions, whose egress rules allow only that registry
#             and the public internet.
#   registrysync  internal: the registry's write side and the registry-sync
#             tool, only while registry-sync.sh copies images.
#   evalnet   shared-runner profile only, internal, IPv6 off: Bifrost's
#             default eval network (each org gets its own, see below).
#
# Third-party images are pinned by digest (tag kept for reading). The server
# and runner images are built here from this checkout
# (deploy/hosted/Dockerfile.server).
name: heimdall

x-labels: &labels
  heimdall: "1"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

networks:
  edge:
    labels: *labels
  backend:
    internal: true
    labels: *labels
  upstream:
    enable_ipv6: false
    labels: *labels
  # The server and the fault proxy's control port only (no route out).
  faultctl:
    internal: true
    enable_ipv6: false
    labels: *labels
  # The server reaches the shared gateway's log API on this network only
  # (per-organization prompt log list, delete and retention; lane X03).
  gatewaylogs:
    internal: true
    labels: *labels
  buildnet:
    # shared-runner profile: the read-only image registry, the shared runner
    # and its image build sessions (each a guard plus a fresh BuildKit,
    # started by the runner per org build; cmd/bifrost-bench/buildsession.go).
    # Not internal (packages are installed from the internet), but no
    # Heimdall service, database or gateway is on it, and each session's
    # guard refuses private, link-local and metadata addresses
    # (build-egress.sh). Fixed name: the runner starts sessions on it.
    name: ${HEIMDALL_BUILD_NETWORK:-heimdall-buildnet}
    enable_ipv6: false
    labels: *labels
  registrysync:
    # registry-sync profile: the registry's write side and the sync tool.
    # Nothing else joins it, and it has no route out.
    internal: true
    enable_ipv6: false
    labels: *labels
  imagepublish:
    # shared-runner profile: the shared runner and image-publisher only.
    internal: true
    enable_ipv6: false
    labels: *labels
  rtgate:
    # shared-runner profile, internal: the shared worker reaches its runs'
    # tool gates here by container name (remote_tools.ingress_network), so
    # gates publish no host port. Only the worker and the gates join it.
    name: ${HEIMDALL_RTGATE_NETWORK:-heimdall-rtgate}
    internal: true
    enable_ipv6: false
    labels: *labels
  voice:
    # voice profile: LiveKit, LiveKit SIP, their Redis and the real-time
    # voice gateway. Not internal: the gateway reaches teams' LiveKit
    # servers and start URLs, LiveKit SIP reaches SIP trunks.
    enable_ipv6: false
    labels: *labels
  evalnet:
    # Fixed name: Bifrost's default eval network. The shared runner does
    # not start agents on it: each org gets its own internal network,
    # heimdall-evalnet-<org>, which only the gateway joins.
    name: ${HEIMDALL_EVAL_NETWORK:-heimdall-evalnet}
    internal: true
    enable_ipv6: false
    labels: *labels

volumes:
  pgdata:
    labels: *labels
  publish-tmp:
    labels: *labels
  heimdall-data:
    labels: *labels
  caddy-data:
    labels: *labels
  caddy-config:
    labels: *labels
  bifrost-pgdata:
    labels: *labels
  bifrost-data:
    labels: *labels
  faultproxy-ledger:
    labels: *labels
  # The shared worker's image registry, unless HEIMDALL_REGISTRY_DIR names
  # a host folder (on the data disk) instead.
  registry-data:
    labels: *labels
  # Profile monitoring (lane Z14).
  prometheus-data:
    labels: *labels
  grafana-data:
    labels: *labels
  tempo-data:
    labels: *labels
  voice-redis-data:
    labels: *labels

services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    labels: *labels
    <<: [*hardening, *logging]
    # Caddy binds 80 and 443 inside the container; it needs that capability
    # and nothing else.
    cap_add: [NET_BIND_SERVICE]
    environment:
      HEIMDALL_DOMAIN: ${HEIMDALL_DOMAIN:?set HEIMDALL_DOMAIN in deploy/hosted/.env}
      HEIMDALL_ACME_EMAIL: ${HEIMDALL_ACME_EMAIL:-}
      HEIMDALL_MAX_BODY: ${HEIMDALL_MAX_BODY:-2MiB}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [edge]
    ports:
      # HEIMDALL_*_PUBLISH may carry a bind address, e.g. 127.0.0.1:28443.
      - "${HEIMDALL_HTTP_PUBLISH:-80}:80"
      - "${HEIMDALL_HTTPS_PUBLISH:-443}:443"
      - "${HEIMDALL_HTTPS_PUBLISH:-443}:443/udp"
    depends_on:
      heimdall:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    labels: *labels
    <<: *logging
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${HEIMDALL_PG_PASSWORD:?set HEIMDALL_PG_PASSWORD in deploy/hosted/.env}
      POSTGRES_DB: heimdall
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    shm_size: 256m
    # Over TCP on purpose: the image's entrypoint runs a temporary init server
    # on the Unix socket only, so a socket check can pass too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U heimdall -d heimdall"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  heimdall:
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile.server
      target: server
      args:
        # The commit /downloads is built at (deploy/hosted/lib.sh sets it).
        HEIMDALL_COMMIT: ${HEIMDALL_COMMIT:-}
    image: ${HEIMDALL_IMAGE:-heimdall/server:local}
    labels: *labels
    <<: [*hardening, *logging]
    command: ["serve", "-config", "/srv/heimdall/deploy/bench.yaml"]
    environment:
      HEIMDALL_DATABASE_URL: postgres://heimdall:${HEIMDALL_PG_PASSWORD:?set HEIMDALL_PG_PASSWORD in deploy/hosted/.env}@postgres:5432/heimdall?sslmode=disable
      BENCH_AUTH_PUBLIC_URL: ${HEIMDALL_PUBLIC_URL:-https://${HEIMDALL_DOMAIN:?set HEIMDALL_DOMAIN in deploy/hosted/.env}}
      BENCH_AUTH_SIGNUP: ${HEIMDALL_SIGNUP:-invite}
      BENCH_AUTH_SIGNUP_DOMAINS: ${HEIMDALL_SIGNUP_DOMAINS:-}
      HEIMDALL_SIGNUP_PER_HOUR: ${HEIMDALL_SIGNUP_PER_HOUR:-}
      HEIMDALL_CAPTCHA_SECRET: ${HEIMDALL_CAPTCHA_SECRET:-}
      HEIMDALL_CAPTCHA_SITEKEY: ${HEIMDALL_CAPTCHA_SITEKEY:-}
      HEIMDALL_IMAGE_AUTO_APPROVE: ${HEIMDALL_IMAGE_AUTO_APPROVE:-}
      HEIMDALL_FAULT_MODE: ${HEIMDALL_FAULT_MODE:-}
      HEIMDALL_WARM_SUITES: ${HEIMDALL_WARM_SUITES:-}
      # DNS servers for guarded outbound calls (webhooks, MCP test, Connect):
      # empty uses 1.1.1.1:53,8.8.8.8:53; "system" uses the container's resolver.
      HEIMDALL_PUBLIC_DNS: ${HEIMDALL_PUBLIC_DNS:-}
      # Python with the modal package: Settings > Workers tests a Modal token
      # with it before keeping it.
      HEIMDALL_MODAL_PYTHON: ${HEIMDALL_MODAL_PYTHON:-/opt/modal/bin/python3}
      # security.txt Contact (mailto: or https:); empty uses <public url>/security.
      HEIMDALL_SECURITY_CONTACT: ${HEIMDALL_SECURITY_CONTACT:-}
      # The public name, and "heimdall" for the shared worker on the edge network.
      BENCH_SERVER_ALLOWED_HOSTS: ${HEIMDALL_DOMAIN},heimdall
      # Only compose networks reach the server (its port is not published),
      # and Caddy overwrites X-Forwarded-For with the real client address, so
      # the server takes the client IP (rate limits, audit) from that header
      # when the peer is a private address.
      BENCH_AUTH_TRUSTED_PROXIES: ${HEIMDALL_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # GitHub sign-in is on only when a client id is set; the variable
      # names are cleared when it is empty (older servers refused to start
      # on named but empty variables).
      BENCH_AUTH_GITHUB_CLIENT_ID_ENV: ${HEIMDALL_GITHUB_CLIENT_ID:+HEIMDALL_GITHUB_CLIENT_ID}
      BENCH_AUTH_GITHUB_CLIENT_SECRET_ENV: ${HEIMDALL_GITHUB_CLIENT_ID:+HEIMDALL_GITHUB_CLIENT_SECRET}
      HEIMDALL_GITHUB_CLIENT_ID: ${HEIMDALL_GITHUB_CLIENT_ID:-}
      HEIMDALL_GITHUB_CLIENT_SECRET: ${HEIMDALL_GITHUB_CLIENT_SECRET:-}
      # The evidence mirror is on exactly when a bucket is named.
      BENCH_STORAGE_S3_BUCKET: ${HEIMDALL_S3_BUCKET:-}
      BENCH_STORAGE_S3_REGION: ${HEIMDALL_S3_REGION:-}
      HEIMDALL_S3_ENDPOINT: ${HEIMDALL_S3_ENDPOINT:-}
      HEIMDALL_S3_ACCESS_KEY: ${HEIMDALL_S3_ACCESS_KEY:-}
      HEIMDALL_S3_SECRET_KEY: ${HEIMDALL_S3_SECRET_KEY:-}
      # Web parity guardrails (docs/hosting.md "Shared runner pool"): server
      # admins by email, the master key the keystore encrypts org keys and
      # shared pool runner tokens with, and the secret the shared runner
      # fetches its assignments with (empty: no shared pool).
      HEIMDALL_SERVER_ADMINS: ${HEIMDALL_SERVER_ADMINS:-}
      HEIMDALL_SERVER_ADMIN_IDS: ${HEIMDALL_SERVER_ADMIN_IDS:-}
      HEIMDALL_MASTER_KEY: ${HEIMDALL_MASTER_KEY:-}
      HEIMDALL_SHARED_RUNNER_SECRET: ${HEIMDALL_SHARED_RUNNER_SECRET:-}
      HEIMDALL_PULL_SIGNING_KEY: ${HEIMDALL_PULL_SIGNING_KEY:-} # pull-mode agents (docs/pull-agents.md)
      HEIMDALL_LIBRARY_DIR: ${HEIMDALL_LIBRARY_DIR:-}
      # First estimates (docs/evaluations.md, Budget and estimates): the run
      # store of the platform org that runs reference agents on the library
      # (a path in heimdall-data; empty: each org's own runs only), and the
      # largest budget the wizard suggests (empty: 100 USD).
      HEIMDALL_LIBRARY_RUNS_ROOT: ${HEIMDALL_LIBRARY_RUNS_ROOT:-}
      HEIMDALL_EVAL_BUDGET_MAX_USD: ${HEIMDALL_EVAL_BUDGET_MAX_USD:-}
      # Email (docs/notifications.md): one transport, the first one set
      # wins; none set writes emails to the server log only.
      HEIMDALL_SMTP_URL: ${HEIMDALL_SMTP_URL:-}
      HEIMDALL_RESEND_API_KEY: ${HEIMDALL_RESEND_API_KEY:-}
      HEIMDALL_POSTMARK_TOKEN: ${HEIMDALL_POSTMARK_TOKEN:-}
      HEIMDALL_MAIL_FROM: ${HEIMDALL_MAIL_FROM:-}
      # Plans and billing (docs/hosting.md, Billing): off unless
      # HEIMDALL_BILLING=on; Stripe stays in test mode unless
      # HEIMDALL_STRIPE_ALLOW_LIVE=1.
      HEIMDALL_BILLING: ${HEIMDALL_BILLING:-}
      HEIMDALL_STRIPE_SECRET_KEY: ${HEIMDALL_STRIPE_SECRET_KEY:-}
      HEIMDALL_STRIPE_WEBHOOK_SECRET: ${HEIMDALL_STRIPE_WEBHOOK_SECRET:-}
      HEIMDALL_STRIPE_TEAM_PRICE: ${HEIMDALL_STRIPE_TEAM_PRICE:-}
      HEIMDALL_STRIPE_ALLOW_LIVE: ${HEIMDALL_STRIPE_ALLOW_LIVE:-}
      HEIMDALL_SALES_CONTACT: ${HEIMDALL_SALES_CONTACT:-}
      # Evaluations running at once on the platform and per organization
      # (docs/hosting.md, Settings reference); 0: the defaults (64 and 8).
      BENCH_JOBS_EXPERIMENT_LIMIT: ${HEIMDALL_EXPERIMENT_LIMIT:-0}
      BENCH_JOBS_EXPERIMENT_PER_ORG: ${HEIMDALL_EXPERIMENT_PER_ORG:-0}
      # Benchmarks built from GitHub issues (From issues, docs/hosting.md,
      # Settings reference): builder model when the form names none, dollar
      # caps per build and per model check job, and the build network.
      BENCH_ISSUEBENCH_PROVIDER: ${BENCH_ISSUEBENCH_PROVIDER:-}
      BENCH_ISSUEBENCH_MODEL: ${BENCH_ISSUEBENCH_MODEL:-}
      BENCH_ISSUEBENCH_MAX_USD: ${BENCH_ISSUEBENCH_MAX_USD:-}
      BENCH_ISSUEBENCH_CHECK_MAX_USD: ${BENCH_ISSUEBENCH_CHECK_MAX_USD:-}
      BENCH_ISSUEBENCH_NETWORK: ${BENCH_ISSUEBENCH_NETWORK:-}
      # Extra hosts (comma separated) a From issues build sandbox may reach
      # through its egress proxy, on top of the Python package registries.
      BENCH_ISSUEBENCH_EGRESS_ALLOW: ${BENCH_ISSUEBENCH_EGRESS_ALLOW:-}
      # Real-time voice calls (voice profile, docs/voice-realtime.md).
      HEIMDALL_VOICE_RTC_URL: ${HEIMDALL_VOICE_RTC_URL:-}
      HEIMDALL_VOICE_RTC_SECRET: ${HEIMDALL_VOICE_RTC_SECRET:-}
      HEIMDALL_VOICE_SIP_ALLOW: ${HEIMDALL_VOICE_SIP_ALLOW:-}
      # Prometheus metrics on the compose network only (docs/hosting.md,
      # Operating it); empty: off. Never publish this port.
      BENCH_SERVER_METRICS_LISTEN: ${HEIMDALL_METRICS_LISTEN:-}
      # Lane Z14 (docs/monitoring.md): platform traces to an OTLP/HTTP
      # endpoint (profile monitoring: http://otel-collector:4318; empty:
      # off), the public status page's incident file (edited with
      # `bifrost-bench status incident ...`) and its extra HTTP probes.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${HEIMDALL_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: heimdall-server
      OTEL_TRACES_SAMPLER: ${HEIMDALL_OTEL_SAMPLER:-parentbased_always_on}
      HEIMDALL_STATUS_FILE: /var/lib/heimdall/status/incidents.json
      # Extra /status lines; the default probes the model gateway (the bifrost
      # service below, the address its own healthcheck uses).
      HEIMDALL_STATUS_PROBES: ${HEIMDALL_STATUS_PROBES:-gateway=http://bifrost:8080/health}
      # Per-token and per-org API rate limits (empty: the built-in defaults,
      # "off": none), and the runner image Heimdall starts for an org's own
      # worker on Fly Machines or Kubernetes (empty: the published default).
      HEIMDALL_API_RATE_LIMITS: ${HEIMDALL_API_RATE_LIMITS:-}
      HEIMDALL_RUNNER_IMAGE: ${HEIMDALL_RUNNER_IMAGE:-}
      # Per-organization prompt logs: the server lists, deletes and expires
      # one organization's rows in the shared gateway's log store. Empty URL
      # with the shared pool on means http://bifrost:8080; "off" disables it.
      HEIMDALL_GATEWAY_LOGS_URL: ${HEIMDALL_GATEWAY_LOGS_URL:-}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      # The server registers an org's own key at the fault proxy (PUT
      # /orgslots on faultctl) before it mints a gateway key for that org's
      # From issues builds and model checks.
      BENCH_FAULTPROXY_TOKEN: ${BENCH_FAULTPROXY_TOKEN:-}
      # Where deployed agents reach the shared worker's gateway and tools
      # (Caddy's /gw and /rt). The planner refuses a run whose agent could
      # not reach them; same values as the shared runner's below.
      BENCH_GATEWAY_PUBLIC_URL: ${HEIMDALL_GATEWAY_PUBLIC_URL:-https://${HEIMDALL_DOMAIN}/gw}
      BENCH_REMOTE_TOOLS_PUBLIC_URL: ${HEIMDALL_TOOLS_PUBLIC_URL:-https://${HEIMDALL_DOMAIN}/rt}
      # The deployed commit, for the worker install script's downloads.
      HEIMDALL_BUILD_COMMIT: ${HEIMDALL_BUILD_COMMIT:-}
      # Checks usage rows the heimdall Bifrost plugin posts; same value as bifrost's.
      HEIMDALL_GATEWAY_USAGE_SECRET: ${HEIMDALL_GATEWAY_USAGE_SECRET:-}
    volumes:
      - ./bench.hosted.yaml:/srv/heimdall/deploy/bench.yaml:ro
      - heimdall-data:/var/lib/heimdall
      # Built-in benchmark library (HEIMDALL_LIBRARY_DIR in .env), read-only at
      # its host path so runners hand task folders to the host's Docker
      # unchanged. Unset binds /dev/null over itself: no library, as before.
      - ${HEIMDALL_LIBRARY_DIR:-/dev/null}:${HEIMDALL_LIBRARY_DIR:-/dev/null}:ro
    tmpfs:
      - /tmp
    networks: [edge, backend, gatewaylogs, faultctl]
    depends_on:
      postgres:
        condition: service_healthy
    # The image's health check reads /readyz: database reachable, migrations
    # current, runs root writable.
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile shared-runner: the shared worker (below) with its own Bifrost
  # gateway, fault proxy, isolated BuildKit and image registry.

  bifrost-postgres:
    profiles: [shared-runner]
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    labels: *labels
    <<: *logging
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: ${BIFROST_PG_PASSWORD:-}
      POSTGRES_DB: bifrost
    volumes:
      - bifrost-pgdata:/var/lib/postgresql
    networks:
      upstream:
        # deploy/bifrost/config.json names its database host "postgres".
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U bifrost -d bifrost"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  faultproxy:
    profiles: [shared-runner]
    image: ${HEIMDALL_IMAGE:-heimdall/server:local}
    labels: *labels
    <<: [*hardening, *logging]
    command: ["proxy", "--config", "/etc/bench/bench.yaml"]
    environment:
      BENCH_FAULTPROXY_TOKEN: ${BENCH_FAULTPROXY_TOKEN:-}
      BENCH_FAULTPROXY_LISTEN: ":9100"
      BENCH_FAULTPROXY_CONTROL_LISTEN: "0.0.0.0:9101"
      BENCH_FAULTPROXY_LEDGER: /var/lib/heimdall/ledger.jsonl
      # Runs that may use one provider at once through this proxy, shared by
      # every runner here; runners set the same count (gateway slots).
      BENCH_FAULTPROXY_SLOTS_PER_PROVIDER: ${HEIMDALL_PROVIDER_SLOTS:-32}
      # Organization key base URLs are org-supplied: dial them only at public
      # addresses, checked at connect time (shared stack only).
      BENCH_FAULTPROXY_PUBLIC_ONLY: "1"
      # Its guarded dialer resolves names through the public DNS servers.
      HEIMDALL_PUBLIC_DNS: ${HEIMDALL_PUBLIC_DNS:-}
      # No server-wide provider keys and no scripted fallback: every org run
      # uses the org's own keys from Models & keys, which runners register
      # per lease. A keyless call fails with "no key configured".
    volumes:
      - ../bench.yaml:/etc/bench/bench.yaml:ro
      - faultproxy-ledger:/var/lib/heimdall
    tmpfs:
      - /tmp
    # faultctl: the server reaches the control port (token protected) to
    # register org keys; it has no other way onto upstream.
    networks: [upstream, faultctl]
    healthcheck:
      disable: true
    restart: unless-stopped

  bifrost:
    profiles: [shared-runner]
    image: maximhq/bifrost:v2.5.1@sha256:5ec9873acaf1687556b6e4dd854b92b539d9debf87a5a683b66338648b84d3c8
    labels: *labels
    <<: *logging
    environment:
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      BIFROST_PG_PASSWORD: ${BIFROST_PG_PASSWORD:-}
      # Shared with the heimdall service: the heimdall plugin's usage export.
      HEIMDALL_GATEWAY_USAGE_SECRET: ${HEIMDALL_GATEWAY_USAGE_SECRET:-}
      LOG_STYLE: json
    volumes:
      - bifrost-data:/app/data
      - ../bifrost/config.json:/app/data/config.json:ro
      - ../bifrost/datasheet:/app/datasheet:ro
    depends_on:
      bifrost-postgres:
        condition: service_healthy
      faultproxy:
        condition: service_started
    networks: [evalnet, upstream, gatewaylogs]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # Profile shared-runner: the shared runner pool (web parity F3). Serves
  # every org whose limits allow the shared pool, one worker loop per org.
  # Needs HEIMDALL_SHARED_RUNNER_SECRET on both sides.
  #   docker compose ... --profile shared-runner up -d
  # Isolation between orgs (docs/hosting.md "Shared worker"):
  #   - containers run under gVisor (runsc); without it the runner does not
  #     start unless the operator sets HEIMDALL_SHARED_ALLOW_RUNC
  #     (install-gvisor.sh installs it);
  #   - org Dockerfiles build in a build session of their own: a fresh
  #     rootless BuildKit per build behind egress rules, one build at a time
  #     per org, with the org's own cache volume (no host socket for
  #     BuildKit); images load as org-<id>/<tag>; pulls only of approved
  #     images;
  #   - their bench and platform base images (FROM bench/...) come from the
  #     read-only registry below, pinned by the digests registry-sync.sh
  #     records;
  #   - each org's agents get their own internal network;
  #   - no server data is mounted: each org's project is downloaded with
  #     that org's own runner token, into HEIMDALL_RUNNER_DIR/projects/<org>.

  # The shared worker's private image registry as org builds see it: the
  # bench and operator platform images that org Dockerfiles build FROM,
  # which a build session's BuildKit cannot see on the host daemon. Read
  # only (registry/config-read.yml, storage mounted read-only), pull
  # credentials required, on the build network, no host port. Only
  # registry-sync.sh writes, through registry-writer.
  registry:
    profiles: [shared-runner]
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    labels: *labels
    <<: [*hardening, *logging]
    # Reads the credential files (mode 0640, group of the Docker socket).
    group_add: ["${HEIMDALL_DOCKER_GID:-0}"]
    volumes:
      - ${HEIMDALL_REGISTRY_DIR:-registry-data}:/var/lib/registry:ro
      - ./registry/config-read.yml:/etc/docker/registry/config.yml:ro
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/registry:/auth:ro
    tmpfs:
      - /tmp
    networks:
      buildnet:
        aliases: [registry]
    restart: unless-stopped

  # The registry's write side. Only image-publisher and the registry-sync tool
  # join registrysync; no build, no agent and no org container can reach it.
  # It uses the sync identity's credentials (registry/config-write.yml).
  registry-writer:
    profiles: [shared-runner]
    restart: unless-stopped
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    labels: *labels
    <<: [*hardening, *logging]
    group_add: ["${HEIMDALL_DOCKER_GID:-0}"]
    volumes:
      - ${HEIMDALL_REGISTRY_DIR:-registry-data}:/var/lib/registry
      - ./registry/config-write.yml:/etc/docker/registry/config.yml:ro
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/writer:/auth:ro
    tmpfs:
      - /tmp
    networks: [registrysync]

  # Tool, never started by `up`: deploy/hosted/registry-sync.sh pipes a
  # `docker save` of a host image into it and it pushes the image to
  # registry-writer over the registrysync network with the sync identity.
  registry-sync:
    profiles: [registry-sync]
    image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    labels: *labels
    <<: *logging
    # The image is staged in the container's own layer (on disk, not RAM)
    # and goes with the container.
    entrypoint: ["/busybox/sh", "-c"]
    volumes:
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/sync:/auth:ro
    networks: [registrysync]

  # The image publisher (wave 4): the only holder of the registry's write
  # identity. No Docker socket. The shared runner streams it a saved image
  # over the internal imagepublish network; it accepts only platform images
  # computed from the read-only checkout and library, pushes them to
  # registry-writer and records their digests in the manifest.
  image-publisher:
    profiles: [shared-runner]
    image: ${HEIMDALL_RUNNER_IMAGE:-heimdall/runner:local}
    labels: *labels
    <<: [*hardening, *logging]
    group_add: ["${HEIMDALL_DOCKER_GID:-0}"]
    command: ["bifrost-bench", "registry", "publisher", "-auth-file", "/auth/push.auth", "-manifest", "/manifest/manifest", "-token-file", "/manifest/publish.token", "-checkout", "${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}", "-library", "${HEIMDALL_LIBRARY_DIR:-}"]
    environment:
      HOME: /tmp
    volumes:
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/sync:/auth:ro
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/runner:/manifest
      - ${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}:${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}:ro
      - ${HEIMDALL_LIBRARY_DIR:-/dev/null}:${HEIMDALL_LIBRARY_DIR:-/dev/null}:ro
      - publish-tmp:/var/tmp/heimdall-publish
    tmpfs:
      - /tmp
    networks: [registrysync, imagepublish]
    depends_on:
      registry-writer:
        condition: service_started
    restart: unless-stopped

  shared-runner:
    profiles: [shared-runner]
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile.server
      target: runner
    image: ${HEIMDALL_RUNNER_IMAGE:-heimdall/runner:local}
    labels: *labels
    <<: [*hardening, *logging]
    # Agent containers are started on the host's Docker through its socket,
    # so every path the runner hands to `docker run -v` must mean the same on
    # the host: the checkout and the runner's data folder are mounted at
    # their host paths.
    group_add: ["${HEIMDALL_DOCKER_GID:-0}"]
    working_dir: ${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        [ -n "$${HEIMDALL_SHARED_RUNNER_SECRET:-}" ] || { echo "HEIMDALL_SHARED_RUNNER_SECRET is empty: set it in deploy/hosted/.env (docs/hosting.md)" >&2; exit 64; }
        printf '%s' "$$HEIMDALL_SHARED_RUNNER_SECRET" > /tmp/shared.secret
        unset HEIMDALL_SHARED_RUNNER_SECRET
        exec bifrost-bench runner start -shared -server http://heimdall:8090 -secret-file /tmp/shared.secret \
          -config "$$HEIMDALL_BENCH_DIR/deploy/bench.yaml" -name shared-runner \
          -runtime "$$HEIMDALL_SHARED_RUNTIME" -slots "$$HEIMDALL_SHARED_SLOTS" \
          -host-slots "$$HEIMDALL_SHARED_HOST_SLOTS" \
          -projects-dir "$$HEIMDALL_SHARED_PROJECTS_MIRROR"
    environment:
      HOME: /tmp
      HEIMDALL_SHARED_RUNNER_SECRET: ${HEIMDALL_SHARED_RUNNER_SECRET:-}
      HEIMDALL_PULL_SIGNING_KEY: ${HEIMDALL_PULL_SIGNING_KEY:-} # pull-mode agents: the same key as the server
      BENCH_PULL_URL: ${HEIMDALL_PUBLIC_URL:-https://${HEIMDALL_DOMAIN}} # where a pull run's launcher reaches the server
      HEIMDALL_SHARED_RUNTIME: ${HEIMDALL_SHARED_RUNTIME:-auto}
      HEIMDALL_FAULT_MODE: ${HEIMDALL_FAULT_MODE:-} # proxy (default) or plugin, the same as the server
      HEIMDALL_PUBLIC_DNS: ${HEIMDALL_PUBLIC_DNS:-} # guarded calls to org sandbox platforms resolve through these servers
      # Operator override, logged on every start: run under runc when the
      # host has no gVisor, serving only orgs a server admin set to runc.
      HEIMDALL_SHARED_ALLOW_RUNC: ${HEIMDALL_SHARED_ALLOW_RUNC:-}
      HEIMDALL_SHARED_SLOTS: ${HEIMDALL_SHARED_SLOTS:-4}
      HEIMDALL_SHARED_HOST_SLOTS: ${HEIMDALL_SHARED_HOST_SLOTS:-0}
      # From issues builds (job kind issuebench.work): extra egress hosts for
      # the build sandbox, and builds at once on this worker (default 1).
      BENCH_ISSUEBENCH_EGRESS_ALLOW: ${BENCH_ISSUEBENCH_EGRESS_ALLOW:-}
      HEIMDALL_SHARED_ISSUEBENCH_CONCURRENCY: ${HEIMDALL_SHARED_ISSUEBENCH_CONCURRENCY:-1}
      HEIMDALL_BENCH_DIR: ${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}
      BENCH_RUNS_ROOT: ${HEIMDALL_RUNNER_DIR:-/var/lib/heimdall-shared-runner}/runs
      BENCH_RELEASES_ROOT: ${HEIMDALL_RUNNER_DIR:-/var/lib/heimdall-shared-runner}/releases
      BENCH_GATEWAY_URL: http://bifrost:8080
      BENCH_GATEWAY_AGENT_URL: http://bifrost:8080
      BENCH_GATEWAY_FAULT_PROXY_URL: http://faultproxy:9100
      BENCH_FAULTPROXY_CONTROL_URL: http://faultproxy:9101
      BENCH_NETWORKS_EVAL: ${HEIMDALL_EVAL_NETWORK:-heimdall-evalnet}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      BENCH_FAULTPROXY_TOKEN: ${BENCH_FAULTPROXY_TOKEN:-}
      BENCH_GATEWAY_SLOTS_PER_PROVIDER: ${HEIMDALL_PROVIDER_SLOTS:-32}
      BENCH_GATEWAY_ORG_SLOTS_PER_PROVIDER: ${HEIMDALL_PROVIDER_SLOTS:-32}
      BENCH_RUNNER_DISK_MIN_FREE_GB: ${HEIMDALL_RUNNER_MIN_FREE_GB:-10}
      HEIMDALL_SHARED_PROJECTS_MIRROR: ${HEIMDALL_RUNNER_DIR:-/var/lib/heimdall-shared-runner}/projects
      # Image build sessions (cmd/bifrost-bench/buildsession.go): one fresh
      # rootless BuildKit per org build, in the network namespace of a guard
      # (this image, NET_ADMIN only) that installs the egress rules.
      HEIMDALL_BUILDKIT_IMAGE: moby/buildkit:v0.35.0-rootless@sha256:5987568f92dafbfb679879de59c1cd8d26597f5f6635c314e166164e2615870c
      HEIMDALL_BUILD_GUARD_IMAGE: ${HEIMDALL_RUNNER_IMAGE:-heimdall/runner:local}
      HEIMDALL_BUILD_NETWORK: ${HEIMDALL_BUILD_NETWORK:-heimdall-buildnet}
      HEIMDALL_BUILDKIT_APPARMOR: ${HEIMDALL_BUILDKIT_APPARMOR:-}
      HEIMDALL_BUILDKIT_CONFIG: ${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}/deploy/hosted/buildkitd.toml
      HEIMDALL_SHARED_REGISTRY: ${HEIMDALL_SHARED_REGISTRY:-registry:5000}
      # Read-only pull credentials and the digest manifest, both written by
      # registry-sync.sh into HEIMDALL_REGISTRY_AUTH_DIR/runner.
      HEIMDALL_SHARED_REGISTRY_AUTH: /run/heimdall-registry/pull.auth
      HEIMDALL_SHARED_REGISTRY_MANIFEST: /run/heimdall-registry/manifest
      # Missing platform base images are published on demand (wave 4).
      HEIMDALL_IMAGE_PUBLISHER_URL: http://image-publisher:8097
      HEIMDALL_IMAGE_PUBLISHER_TOKEN: /run/heimdall-registry/publish.token
      HEIMDALL_SHARED_GATEWAY_CONTAINER: ${HEIMDALL_SHARED_GATEWAY_CONTAINER:-}
      HEIMDALL_SHARED_PLATFORM_IMAGES: ${HEIMDALL_SHARED_PLATFORM_IMAGES:-}
      HEIMDALL_LIBRARY_DIR: ${HEIMDALL_LIBRARY_DIR:-}
      # Python with the modal package, for organizations whose runs go to Modal
      # (the image ships one in /opt/modal).
      HEIMDALL_MODAL_PYTHON: ${HEIMDALL_MODAL_PYTHON:-/opt/modal/bin/python3}
      # Public ingress (Caddy /gw and /rt): deployed agents and cloud
      # sandboxes reach this worker's gateway and live runs' tool gates
      # through https://$HEIMDALL_DOMAIN, with the run's own key or token.
      BENCH_GATEWAY_PUBLIC_URL: ${HEIMDALL_GATEWAY_PUBLIC_URL:-https://${HEIMDALL_DOMAIN}/gw}
      BENCH_REMOTE_TOOLS_PUBLIC_URL: ${HEIMDALL_TOOLS_PUBLIC_URL:-https://${HEIMDALL_DOMAIN}/rt}
      BENCH_REMOTE_TOOLS_INGRESS_LISTEN: 0.0.0.0:9300
      BENCH_REMOTE_TOOLS_INGRESS_NETWORK: ${HEIMDALL_RTGATE_NETWORK:-heimdall-rtgate}
      # Lane Z14: the runner's spans join each evaluation's trace.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${HEIMDALL_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: heimdall-shared-runner
      # Real-time voice calls (voice profile, docs/voice-realtime.md).
      HEIMDALL_VOICE_RTC_URL: ${HEIMDALL_VOICE_RTC_URL:-}
      HEIMDALL_VOICE_RTC_SECRET: ${HEIMDALL_VOICE_RTC_SECRET:-}
      HEIMDALL_VOICE_SIP_ALLOW: ${HEIMDALL_VOICE_SIP_ALLOW:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}:${HEIMDALL_BENCH_DIR:?run through deploy/hosted/*.sh or set HEIMDALL_BENCH_DIR}:ro
      - ${HEIMDALL_RUNNER_DIR:-/var/lib/heimdall-shared-runner}:${HEIMDALL_RUNNER_DIR:-/var/lib/heimdall-shared-runner}
      # No heimdall-data mount: each org's project is downloaded with that
      # org's own runner token (GET /api/bench/workers/project).
      # Built-in benchmark library (HEIMDALL_LIBRARY_DIR in .env), read-only at
      # its host path so runners hand task folders to the host's Docker
      # unchanged. Unset binds /dev/null over itself: no library, as before.
      - ${HEIMDALL_LIBRARY_DIR:-/dev/null}:${HEIMDALL_LIBRARY_DIR:-/dev/null}:ro
      - ${HEIMDALL_REGISTRY_AUTH_DIR:-/var/lib/heimdall-registry-auth}/runner:/run/heimdall-registry:ro
    tmpfs:
      - /tmp
    networks: [edge, upstream, buildnet, rtgate, imagepublish]
    depends_on:
      heimdall:
        condition: service_healthy
      bifrost:
        condition: service_healthy
      registry:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile monitoring (lane Z14, docs/monitoring.md): Prometheus with the
  # alert and SLO rules, Grafana with the platform dashboard, an
  # OpenTelemetry Collector (tail sampling) and Tempo for traces.
  #   HEIMDALL_METRICS_LISTEN=0.0.0.0:9090 and
  #   HEIMDALL_OTEL_ENDPOINT=http://otel-collector:4318 in .env, then
  #   docker compose ... --profile monitoring up -d
  # Nothing here is published to the internet: Grafana listens on the
  # host's loopback only (ssh -L 3000:127.0.0.1:3000 to read it).
  otel-collector:
    profiles: [monitoring]
    image: otel/opentelemetry-collector-contrib:0.135.0@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    labels: *labels
    <<: [*hardening, *logging]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # edge: the shared runner; gatewaylogs: Bifrost's OTel plugin;
    # backend: the server, Tempo and Prometheus.
    networks: [backend, edge, gatewaylogs]
    restart: unless-stopped

  tempo:
    profiles: [monitoring]
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    labels: *labels
    <<: [*hardening, *logging]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [backend]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    labels: *labels
    <<: [*hardening, *logging]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${HEIMDALL_PROMETHEUS_RETENTION:-30d}"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    labels: *labels
    <<: [*hardening, *logging]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${HEIMDALL_GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${HEIMDALL_GRAFANA_PORT:-3000}:3000"
    networks: [backend, edge]
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  # Profile voice: real-time voice calls (docs/voice-realtime.md). LiveKit
  # (Apache-2.0) for WebRTC rooms, LiveKit SIP for phone numbers, and
  # Heimdall's gateway (bench/voice/rtcgateway.py), which joins a room as the
  # simulated caller for each run. Runs reach the gateway through their one
  # egress forwarder at HEIMDALL_VOICE_RTC_URL; teams point their LiveKit
  # Agents workers at LIVEKIT_PUBLIC_URL with keys the operator hands out.
  #
  #   docker compose -f deploy/hosted/docker-compose.yml --env-file deploy/hosted/.env --profile voice up -d

  livekit:
    profiles: [voice]
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    labels: *labels
    <<: [*hardening, *logging]
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # "key: secret", one pair per line; the gateway uses the first.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./voice/livekit.yaml:/etc/livekit.yaml:ro
    networks: [voice]
    ports:
      - "${LIVEKIT_SIGNAL_PUBLISH:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PUBLISH:-7881}:7881/tcp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      voice-redis:
        condition: service_healthy
    restart: unless-stopped

  voice-redis:
    profiles: [voice]
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    labels: *labels
    <<: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - voice-redis-data:/data
    networks: [voice]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  livekit-sip:
    profiles: [voice]
    image: livekit/sip:v1.23.0@sha256:26b5e320482c48d999073dfaf830666b1a312ad0f97d35ae67bd499659b9834e
    labels: *labels
    <<: *logging
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: voice-redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
        logging:
          level: info
    networks: [voice]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped

  voice-rtc:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: deploy/voice/Dockerfile.rtcgateway
    image: ${HEIMDALL_VOICE_RTC_IMAGE:-heimdall/voice-rtc:local}
    labels: *labels
    <<: [*hardening, *logging]
    environment:
      # The gateway refuses to start without it (16 characters or more).
      HEIMDALL_VOICE_RTC_SECRET: ${HEIMDALL_VOICE_RTC_SECRET:-}
      HEIMDALL_VOICE_SIP_ALLOW: ${HEIMDALL_VOICE_SIP_ALLOW:-}
      HEIMDALL_VOICE_MAX_CALLS: ${HEIMDALL_VOICE_MAX_CALLS:-20}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    tmpfs:
      - /tmp
    networks: [voice]
    ports:
      # Where runs' egress forwarders reach the gateway (HEIMDALL_VOICE_RTC_URL).
      # The default binds the Docker bridge only; put Caddy in front for wss.
      - "${HEIMDALL_VOICE_RTC_PUBLISH:-172.17.0.1:8790}:8790"
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped
