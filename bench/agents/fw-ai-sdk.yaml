# Framework agent: a Vercel AI SDK coding agent in Node (generateText with
# tool() tools and stopWhen: stepCountIs(n), the @ai-sdk/openai provider),
# code in examples/frameworks/ai-sdk/. It runs unchanged: the only
# bench-specific things are the standard OpenAI variables below, which point
# it at Bifrost with the run's key.
#
# Speaks the OpenAI Responses API (the provider's default) to Bifrost's
# /openai/v1 route. AGENT_MODEL is sent as the model id; a bare id goes to
# the openai provider. To run it on another provider, override
# gateway.provider, model and env.AGENT_MODEL together, e.g.
#   set: {gateway.provider: anthropic, model: claude-sonnet-4-5, env.AGENT_MODEL: "anthropic/{{model}}"}
# No parser: gateway-level evidence. docs/frameworks.md is the guide.
id: fw-ai-sdk
adapter: command
image: bench/agent-fw-ai-sdk:1
build:
  dockerfile: examples/frameworks/ai-sdk/Dockerfile
  tag: bench/agent-fw-ai-sdk:1
  base_arg: BASE_IMAGE
argv:
  - fw-agent
  - "{{instruction_file}}"
env:
  OPENAI_BASE_URL: "{{gateway.url}}/openai/v1"
  OPENAI_API_KEY: "{{run.key}}"
  AGENT_MODEL: "{{model}}"
  AGENT_MAX_STEPS: "40"
  AGENT_SESSION_ID: "{{run.session}}"
  # Telemetry: none (experimental_telemetry is off unless asked for); the
  # model is a provider instance, so the Vercel AI Gateway is never used.
# Placeholder: every experiment sets the model (an arm may vary it).
model: gpt-5.4-mini
notes:
  project_file: AGENTS.md
# The same budgets as agents/codex.yaml, so a matrix with Codex compares
# agents, not machines. The agent's own step cap is AGENT_MAX_STEPS.
budgets:
  wall_s: 900
  cpus: 2
  mem_gb: 4
gateway:
  provider: openai
  max_retries: 0
