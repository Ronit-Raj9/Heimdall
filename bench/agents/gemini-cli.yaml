# Gemini CLI, headless, through the bench's Bifrost gateway.
#
# STATUS: configured, not run on a real model. No Gemini provider key exists
# for the bench gateway, and the gateway currently owns one provider
# (anthropic). The launch was smoke-tested against a fake Gemini API only
# (docs/harness-matrix.md).
#
# Launch pattern taken from Bifrost's own CLI harness and docs:
# - cli/internal/harness/harness.go: binary gemini, base URL env
#   GOOGLE_GEMINI_BASE_URL on the /genai route, key env GEMINI_API_KEY, model
#   env GEMINI_MODEL and --model.
# - cli/internal/harness/native_config.go geminiWriteNativeConfig: settings.json
#   selects API-key auth (security.auth.selectedType gemini-api-key), so the
#   CLI never tries Google OAuth or Vertex.
# - docs/cli-agents/gemini-cli.mdx: Gemini CLI sends the key as x-goog-api-key,
#   which Bifrost accepts as the virtual key.
# Headless: -p runs one prompt non-interactively, --yolo approves every tool,
# --skip-trust trusts /workspace, --output-format stream-json prints one JSON
# event per line. GEMINI_CLI_CUSTOM_HEADERS adds the session headers.
# tools.exclude drops google_web_search and web_fetch: both run at the model
# provider (search grounding, URL context) and would reach the internet past
# the evaluation network.
#
# Model: the run's model is a Gemini model id (gemini-2.5-pro); Bifrost's
# /genai route defaults to the gemini provider. For another provider the model
# id carries the prefix (openai/gpt-5.1), which Gemini CLI puts in the URL
# path (/v1beta/models/openai/gpt-5.1:streamGenerateContent); Bifrost's route
# matches models/{model:*}, so the slash survives (seen on the wire). Gemini
# CLI can also make side calls on its own flash models (next-speaker check,
# loop detection, history compression). None appeared in the smoke run; in a
# longer session the run's key (one model) refuses them, which shows as an
# error row at the gateway, never as a silent model switch.
id: gemini-cli
adapter: command
image: bench/agent-gemini-cli:1
build:
  dockerfile: agents/images/gemini-cli/Dockerfile
  tag: bench/agent-gemini-cli:1
argv:
  - gemini
  - --model
  - "{{model}}"
  - --yolo
  - --skip-trust
  - --output-format
  - stream-json
  - --prompt
  - "{{instruction}}"
env:
  GOOGLE_GEMINI_BASE_URL: "{{gateway.url}}/genai"
  GEMINI_API_KEY: "{{run.key}}"
  GEMINI_MODEL: "{{model}}"
  GEMINI_DEFAULT_AUTH_TYPE: gemini-api-key
  GEMINI_CLI_CUSTOM_HEADERS: "x-bf-session-id: {{run.session}}, x-bf-session-affinity: off"
  GEMINI_CLI_TRUST_WORKSPACE: "true"
  GEMINI_CLI_NO_RELAUNCH: "true"
  GOOGLE_API_KEY: ""
  GOOGLE_GENAI_USE_VERTEXAI: "false"
  GOOGLE_GENAI_USE_GCA: "false"
files:
  /home/agent/.gemini/settings.json: |
    {
      "security": {"auth": {"selectedType": "gemini-api-key", "useExternal": false}},
      "model": {"name": "{{model}}"},
      "privacy": {"usageStatisticsEnabled": false},
      "telemetry": {"enabled": false},
      "general": {"disableAutoUpdate": true, "disableUpdateNag": true},
      "context": {"fileName": "GEMINI.md"},
      "tools": {"exclude": ["google_web_search", "web_fetch"]}
    }
# Placeholder: every experiment sets the model (an arm may vary it).
model: gemini-2.5-pro
notes:
  project_file: GEMINI.md
  user_path: /home/agent/.gemini/GEMINI.md
budgets:
  wall_s: 900
  cpus: 2
  mem_gb: 4
gateway:
  provider: gemini
  max_retries: 0
