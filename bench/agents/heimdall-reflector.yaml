# Heimdall reflector: the agent improvement runs use as the improver. It is
# a copy of agents/fw-plain-openai.yaml with its own id and a higher step
# cap. It runs on the improver task heimdall-improver (reflect-edit), reads
# the practice evidence mounted read-only under /heimdall/improve/ and
# writes /workspace/edits.json. The improvement run sets its model and
# gateway provider from the agent being improved (or the teacher model),
# its budgets.usd from improver.budget_usd, and adds the evidence as
# files_raw. Do not run it as a normal agent.
#
# No-framework agent: a hand-written tool loop on the OpenAI Python SDK only
# (client.chat.completions.create), code in examples/frameworks/plain-openai/.
# It runs unchanged: the only bench-specific things are the standard OpenAI
# variables below, which point it at Bifrost with the run's key.
# (agents/custom-python.yaml is the same idea with the standard library only.)
#
# Speaks OpenAI chat completions to Bifrost's /openai/v1 route. AGENT_MODEL
# is sent as the model id; a bare id goes to the openai provider.
# To run it on another provider, override gateway.provider, model and
# env.AGENT_MODEL together, e.g.
#   set: {gateway.provider: anthropic, model: claude-sonnet-4-5, env.AGENT_MODEL: "anthropic/{{model}}"}
# No parser: gateway-level evidence. docs/frameworks.md is the guide.
id: heimdall-reflector
adapter: command
image: bench/agent-fw-plain-openai:3
build:
  dockerfile: examples/frameworks/plain-openai/Dockerfile
  tag: bench/agent-fw-plain-openai:3
  base_arg: BASE_IMAGE
argv:
  - fw-agent
  - "{{instruction_file}}"
env:
  OPENAI_BASE_URL: "{{gateway.url}}/openai/v1"
  OPENAI_API_KEY: "{{run.key}}"
  AGENT_MODEL: "{{model}}"
  AGENT_MAX_STEPS: "60"
  AGENT_SESSION_ID: "{{run.session}}"
  # Telemetry: the OpenAI SDK sends nothing but the agent's requests.
# Placeholder: every experiment sets the model (an arm may vary it).
model: gpt-5.4-mini
notes:
  project_file: AGENTS.md
# The same budgets as agents/codex.yaml, so a matrix with Codex compares
# agents, not machines. The agent's own step cap is AGENT_MAX_STEPS.
budgets:
  wall_s: 900
  cpus: 2
  mem_gb: 4
gateway:
  provider: openai
  max_retries: 0
# H02: the agent puts BENCH_GATEWAY_HEADERS in its client's default headers,
# so heimdall plugin faults ride on its model calls (image :2 and later).
adapter_capabilities:
  supports_gateway_headers: true
