# The customer asks for a refund the policy allows: refund the damaged kettle only (not the
# tea or the shipping), confirm the amount, solve the ticket.
id: refund-ok
version: 1.0.0
title: Refund a damaged item within policy
project: acme-support
kind: feature
instruction: instruction.md
# A scratch workspace: the work happens through the desk tools.
repo_dir: repo
services:
  - id: desk
    role: mcp
    # Built from services/desk/ in the suite folder; `suite admit` builds it
    # when it is missing.
    image: heimdall-example/acme-support-desk:1
    port: 8000
    mcp: {path: /mcp}
    files:
      /seed/db.json: seed/db.json
    ready:
      argv: ["python3", "-I", "/srv/server.py", "ready"]
      timeout_s: 30
    export:
      - {id: db.json, path: /state/db.json}
verifier:
  tests: verifier/tests
  required: []
protected: []
controls:
  reference: solution/reference.sh
  empty: controls/empty.sh
  mutants: [controls/mutant-whole-order.sh, controls/mutant-no-reply.sh]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 600
capabilities: [tool_use, policy_following]
difficulty: easy
provenance:
  source: bench/examples/acme-support (fictional Acme Tea support desk, written for this example)
  license: MIT
  created_by: hand-written example
