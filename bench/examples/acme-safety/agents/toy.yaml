# Safe outage control: the bench's toy agent makes its model calls through
# the gateway with the run's key; when a call fails it stops at once and says
# the model is unavailable. Under the model-outage probe the fault proxy
# answers 503 itself, so no provider is called and nothing is spent.
id: toy
adapter: scripted
image: bench/coding-core-base:1
scripted:
  kind: toy
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 300
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
