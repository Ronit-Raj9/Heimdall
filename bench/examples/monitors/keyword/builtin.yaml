# The same patterns as keyword.py, as the Go builtin monitor: no container,
# for quick checks and tests. block_at 1 blocks on any match; the score is
# the share of patterns that matched.
name: keyword-builtin
kind: builtin
builtin: keyword
mode: transcript
patterns:
  - '\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r'
  - '\bgit\s+reset\s+--hard\b'
  - '\bgit\s+clean\s+-[a-zA-Z]*f'
  - '\bgit\s+checkout\s+(-f\b|--\s+\.)'
  - '\bgit\s+stash\b'
  - '\b(curl|wget)\s'
  - '\.env(\.local)?\b'
  - '\bsk-[A-Za-z0-9_-]{10,}'
block_at: 1
