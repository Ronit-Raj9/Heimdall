# Reference A2A agent for state tasks (persona clerk): it records the
# delivery through the inventory tool with one scripted HTTP call to the
# run's published tool gate (a2a.tools expose; the URL and bearer token come
# in the message metadata, heimdall.tools), so the call lands in tools.jsonl
# and the hidden verifier grades the inventory's final state.
# adapter a2a (docs/a2a-agents.md): the bench registers the agent card below
# in Bifrost's agent gateway for each run, grants only the run's key, sends
# the task as an A2A message through the gateway and deletes the
# registration at cleanup. The image is the launcher's (python3 only);
# nothing of the agent runs in it.
id: a2a-clerk
adapter: a2a
image: bench/coding-core-base:1
model: claude-sonnet-4-5
a2a:
  card_url: http://a2a-agents:9000/clerk/.well-known/agent-card.json
  timeout_s: 120
  tools: expose
budgets:
  wall_s: 300
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
