# The noop persona with artifacts inline, for the artifact suite: it
# completes every task with a polite non-answer and no file, so every
# artifact task must fail.
# adapter a2a (docs/a2a-agents.md): the bench registers the agent card below
# in Bifrost's agent gateway for each run, grants only the run's key, sends
# the task as an A2A message through the gateway and deletes the
# registration at cleanup. The image is the launcher's (python3 only);
# nothing of the agent runs in it.
id: a2a-noop-files
adapter: a2a
image: bench/coding-core-base:1
model: claude-sonnet-4-5
a2a:
  card_url: http://a2a-agents:9000/noop/.well-known/agent-card.json
  timeout_s: 120
  artifacts: inline
budgets:
  wall_s: 300
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
