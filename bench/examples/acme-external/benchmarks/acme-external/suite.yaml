# template: external-api
# acme-external: Acme Freight's dispatch agent, tested on a task that needs a
# real HTTP API outside the bench, a weather forecast service. Acme Freight,
# its depots and the weather service (api.weather.example, which never
# resolves) are fictional.
#
# The agent reaches the weather API only through the per-run tool proxy at
# http://toolproxy:9200/x/weather/ (BENCH_EXTERNAL_APIS). The proxy enforces
# the task's allowlist, adds the API key the agent never sees, and records
# every call in tools.jsonl. Without an experiment that opts in to live
# calls, every run is answered from the task's committed cassette with no
# network, so results repeat. After the agent exits, the hidden verifier
# reads plan.json from a pristine copy of the workspace with the agent's diff
# applied and writes a reward.
#
# The base image is the bench's helper image (python3 and git, uid 1000).
id: acme-external
version: 1.0.0
description: Acme Freight dispatch (fictional) against an external weather API, replayed from a cassette.
track: tool_use
environment: docker_workspace
grader: verifier_command
base_image:
  tag: bench/coding-core-base:1
workdir: /workspace
verifier:
  command: ["python3", "/grader/tests/verify.py"]
  result: reward
  result_path: /grader/out/reward.json
  pass_threshold: 1
  restore: []
  timeout_s: 120
tasks: [drone-window]
probes: [model-outage, weather-error-first]
