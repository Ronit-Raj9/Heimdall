id: ord02
version: 1.0.0
title: Multi-buy promotions (buy 2, get 1 free)
project: acme-orders
kind: feature
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says tax is charged on the subtotal before the coupon discount; the code (src/pricing.js, checked by test/pricing.test.js) charges it on subtotal minus discount, which the promotion rules build on"
verifier:
  tests: verifier/tests
  # Node's JUnit reporter writes every testcase with classname "test" and no
  # file name, so a required id is "test::<test name>" (classname::name, as
  # the grader's JUnit reader renders case ids). Test names are unique within
  # the task. Every hidden test is required, so a hidden file that fails to
  # load cannot pass by reporting nothing.
  required:
    - "test::cli_price_shows_promotions"
    - "test::free_units_per_complete_group"
    - "test::units_counted_across_lines_free_from_last_line"
    - "test::order_promo_and_subtotal_after_promotions"
    - "test::coupon_minimum_and_amount_use_subtotal_after_promotions"
    - "test::shipping_and_tax_use_subtotal_after_promotions"
    - "test::stores_without_promotions_unchanged"
    - "test::invalid_promotions_refused"
    - "test::valid_promotions_accepted"
protected: ["test/**"]
controls:
  reference: solution/reference.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
capabilities: [planning, tool_use, test_discipline]
difficulty: medium
provenance:
  source: bench/examples/acme-node (fictional Acme orders service, written for this example)
  license: MIT
  created_by: hand-written example
