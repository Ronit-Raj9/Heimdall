id: ord04
version: 1.0.0
title: Batch catalog lookups in priceOrders
project: acme-orders
kind: performance
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says createCatalog().getMany returns a plain object keyed by SKU with null for unknown SKUs; it returns a Map holding only the known SKUs (src/catalog.js, checked by test/catalog.test.js)"
verifier:
  tests: verifier/tests
  # Node's JUnit reporter writes every testcase with classname "test" and no
  # file name, so a required id is "test::<test name>" (classname::name, as
  # the grader's JUnit reader renders case ids). Test names are unique within
  # the task. Every hidden test is required, so a hidden file that fails to
  # load cannot pass by reporting nothing.
  required:
    - "test::batch_looks_up_each_distinct_sku_once"
    - "test::getmany_batches_hold_at_most_100_skus"
    - "test::get_only_catalog_called_once_per_distinct_sku"
    - "test::single_order_looks_up_each_sku_once"
    - "test::lookups_not_reused_between_calls"
    - "test::large_batch_lookup_count"
    - "test::results_match_one_by_one_pricing"
    - "test::errors_match_one_by_one_pricing"
protected: ["test/**"]
controls:
  reference: solution/reference.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
capabilities: [efficiency, planning, test_discipline]
difficulty: medium
provenance:
  source: bench/examples/acme-node (fictional Acme orders service, written for this example)
  license: MIT
  created_by: hand-written example
