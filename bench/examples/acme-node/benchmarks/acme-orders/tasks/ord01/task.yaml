id: ord01
version: 1.0.0
title: Orders near midnight land on the wrong business day
project: acme-orders
kind: bugfix
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says business days are UTC calendar dates and businessDay ignores the store time zone; the code (src/dates.js, checked by test/dates.test.js) takes the calendar date in store.timeZone"
verifier:
  tests: verifier/tests
  # Node's JUnit reporter writes every testcase with classname "test" and no
  # file name, so a required id is "test::<test name>" (classname::name, as
  # the grader's JUnit reader renders case ids). Test names are unique within
  # the task. Every hidden test is required, so a hidden file that fails to
  # load cannot pass by reporting nothing.
  required:
    - "test::business_day_uses_store_zone_for_offset_timestamps"
    - "test::same_instant_written_with_different_offsets"
    - "test::daylight_saving_time_is_respected"
    - "test::priced_order_reports_business_day"
    - "test::cli_report_and_price_use_store_business_day"
    - "test::coupon_valid_through_last_local_day"
    - "test::coupon_valid_from_first_local_day"
    - "test::offset_timestamps_name_one_instant"
    - "test::importers_return_the_instant"
    - "test::malformed_timestamps_still_rejected"
protected: ["test/**"]
controls:
  reference: solution/reference.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
capabilities: [debugging, planning, test_discipline]
difficulty: medium
provenance:
  source: bench/examples/acme-node (fictional Acme orders service, written for this example)
  license: MIT
  created_by: hand-written example
