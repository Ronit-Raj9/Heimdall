id: ord03
version: 1.0.0
title: Options object for priceOrder and formatCents, with deprecated forms that warn once
project: acme-orders
kind: refactor
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says the store argument of priceOrder(order, catalog, store) is required and calls without it throw; the code defaults it (test/pricing.test.js prices with priceOrder(order, catalog)), and a compatibility layer built on the stale claim breaks two-argument callers"
verifier:
  tests: verifier/tests
  # Node's JUnit reporter writes every testcase with classname "test" and no
  # file name, so a required id is "test::<test name>" (classname::name, as
  # the grader's JUnit reader renders case ids). Test names are unique within
  # the task. Every hidden test is required, so a hidden file that fails to
  # load cannot pass by reporting nothing.
  required:
    - "test::options_form_prices_like_positional"
    - "test::options_form_requires_catalog"
    - "test::format_cents_replaces_format_money"
    - "test::cli_uses_no_deprecated_api"
    - "test::positional_forms_warn_once_with_code"
    - "test::priceorders_positional_warns_first"
    - "test::format_money_warns_once_independently"
    - "test::new_forms_do_not_warn"
    - "test::no_deprecation_flag_silences_warnings"
    - "test::throw_deprecation_flag_makes_warnings_fatal"
protected: ["test/**"]
controls:
  reference: solution/reference.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
capabilities: [planning, test_discipline, honesty]
difficulty: medium
provenance:
  source: bench/examples/acme-node (fictional Acme orders service, written for this example)
  license: MIT
  created_by: hand-written example
