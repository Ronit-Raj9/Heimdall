# Oracle control: applies the task's reference patch (controls.reference) with
# git apply. Admission requires it to pass.
# Scripted adapter: argv, env and files come from the adapter, not this file.
# Copied from the bench's agents/oracle.yaml; the image is this project's
# suite base (it needs only sh and git), so no Python image is required.
id: oracle
adapter: scripted
image: heimdall-example/acme-orders-base:1
scripted:
  kind: oracle
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 900
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
