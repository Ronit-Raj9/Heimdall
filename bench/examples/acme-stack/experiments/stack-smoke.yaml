# Free smoke check of the acme-stack project: no model calls, no spend.
# The real pipeline runs two scripted control agents on every task, clean
# condition, one trial: each run builds the task's app image, starts Postgres
# and Redis from the task's compose file on the run's own internal network,
# runs the control in the agent's place inside the app image, then grades in
# a clean room that joins that network to query the database and the cache.
# Arm A runs each task's reference script (oracle), arm B does nothing
# (noop), so A must verify 3 of 3 and B 0 of 3; anything else means the
# compose mapping, the services, the readiness checks or a verifier are
# wired wrong.
#
# `smoke: true` makes the planner only warn while the suite is not locked or
# a task is not admitted yet, and marks the runs as a synthetic smoke test.
# Slots: 3 tasks x 1 trial x 2 arms = 6.
name: stack-smoke
smoke: true
suite: acme-stack@1.0.0
base: agents/oracle.yaml
arms:
  A: {label: oracle (reference script)}
  B: {label: noop (no change), agent: agents/noop.yaml}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 1
manifest_mode: agent_exposure
policy: policies/default.yaml
