# Oracle control: runs the task's reference script (controls.reference) in
# the agent's place, with the stack up (Postgres and Redis beside it), so
# the verifier must pass it. Scripted adapter: argv, env and files come from
# the adapter, not this file. A scripted control runs in the task's own image
# (the app image built from stack/app/), as it does at admission; the image
# below is only the fallback for a task without one. Copied from the bench's
# agents/oracle.yaml.
id: oracle
adapter: scripted
image: bench/coding-core-base:1
scripted:
  kind: oracle
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 600
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
