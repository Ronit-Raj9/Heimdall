# Make the health endpoint report the database. The environment is the docker compose stack in stack/:
# the app is the agent's workspace, Postgres and Redis run beside it.
id: health-db
version: 1.0.0
title: Make the health endpoint report the database
project: acme-shop
kind: bugfix
instruction: instruction.md
# The workspace comes from the app image (stack/app/ copied to /app).
repo_dir: repo
compose: stack/compose.yaml
verifier:
  tests: verifier/tests
  required: []
protected: []
controls:
  reference: solution/reference.sh
  empty: controls/empty.sh
  mutants: [controls/mutant-always-up.sh, controls/mutant-down-200.sh]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 600
capabilities: [observability, error_handling]
difficulty: easy
provenance:
  source: bench/examples/acme-stack (fictional Acme Shop, written for this example)
  license: MIT
  created_by: hand-written example
