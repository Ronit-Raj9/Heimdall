# Length of the Ferrow Tunnel (numeric). The agent searches the web
# through the suite's websearch tool (Tavily, replayed from the suite's
# cassette), writes answer.txt and sources.json, and the hidden verifier
# checks the answer and the cited sources (verifier/tests/research.json).
id: tunnel-length
version: 1.0.0
title: Length of the Ferrow Tunnel
project: acme-research
kind: feature
instruction: instruction.md
# The workspace: the house rules for research answers.
repo_dir: repo
output:
  kind: artifact
  artifacts:
    - {id: answer, path: answer.txt, required: true, max_bytes: 65536}
    - {id: sources, path: sources.json, max_bytes: 65536}
verifier:
  tests: verifier/tests
  required: []
protected: ["RESEARCH.md"]
controls:
  # Scripts run in the agent's place with the websearch service and the
  # Tavily route up, in replay mode.
  reference: solution/reference.sh
  empty: controls/empty.sh
  mutants: [controls/mutant-bridge.sh]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 600
capabilities: [research, web_search, citation]
difficulty: easy
provenance:
  source: bench/examples/acme-research (fictional Calder Coast corpus, written for this example)
  license: MIT
  created_by: hand-written example
