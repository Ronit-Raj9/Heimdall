# Free smoke check of the acme-research project: no model calls, no spend,
# no network. The real pipeline runs two scripted control agents on every
# task, clean condition, one trial: the tool proxy starts with the Tavily
# route in replay mode (the suite's cassette, recorded from the Tavily
# stand-in), the websearch MCP server starts beside the agent, the control
# searches and fetches through them, every call lands in tools.jsonl (the
# MCP call and the replayed Tavily call), and the hidden verifier grades
# answer.txt and sources.json. Arm A runs each task's reference script
# (oracle), arm B does nothing (noop), so A must verify 8 of 8 and B 0 of 8;
# anything else means the route, the cassette, the service or the verifier
# is wired wrong. The research metrics (searches, sources_cited,
# citations_grounded, citation_precision) are reported per arm.
#
# `smoke: true` makes the planner only warn while the suite is not locked or
# a task is not admitted yet, and marks the runs as a synthetic smoke test.
# Slots: 8 tasks x 1 trial x 2 arms = 16.
name: research-smoke
smoke: true
suite: acme-research@1.0.0
base: agents/oracle.yaml
arms:
  A: {label: oracle (reference script)}
  B: {label: noop (no change), agent: agents/noop.yaml}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 1
manifest_mode: agent_exposure
policy: policies/default.yaml
