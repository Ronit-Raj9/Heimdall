# Noop control: does nothing in every session and exits 0, so no answer is
# written and its final message is empty. Admission requires it to fail.
# Scripted adapter: argv, env and files come from the adapter, not this file.
# Copied from the bench's agents/noop.yaml; the image is the bench helper
# image, which is also this project's suite base.
id: noop
adapter: scripted
image: bench/coding-core-base:1
scripted:
  kind: noop
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 900
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
