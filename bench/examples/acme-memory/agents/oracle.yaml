# Oracle control: in a memory task it writes the task's reference answer
# (controls.reference, solution/answer.txt) as its answer in the graded last
# session, so it passes without remembering anything. It proves the
# sessions, the answer export and the answer_match grade end to end; it says
# nothing about memory. Admission requires it to pass.
# Scripted adapter: argv, env and files come from the adapter, not this file.
# Copied from the bench's agents/oracle.yaml; the image is the bench helper
# image, which is also this project's suite base.
id: oracle
adapter: scripted
image: bench/coding-core-base:1
scripted:
  kind: oracle
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 900
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
