# Heimdall's reference cascaded voice agent (bench/voice/cascadedagent.py):
# it answers the call, transcribes the caller at /v1/audio/transcriptions,
# runs the conversation and the helpdesk tools at /v1/chat/completions and
# speaks at /v1/audio/speech, all through the gateway on the run's key. It
# stops talking when the caller barges in.
#
# Models are openai/<name> through the gateway. On Heimdall's own test stack
# the gateway's openai provider points at the scripted audio and chat fake
# (bench/voice/fakeopenai.py), so nothing is spent; with a real provider key
# these are paid calls. Never run it on a shared stack whose openai provider
# holds a real key unless you mean to.
id: voice-cascaded
adapter: command
image: heimdall-example/voice-agent:1
build:
  dockerfile: agents/images/voice-agent/Dockerfile
  tag: heimdall-example/voice-agent:1
argv: ["python3", "/opt/voice-agent/cascadedagent.py", "--mode", "good", "{{instruction}}"]
env:
  VOICE_GATEWAY_URL: "{{gateway.url}}"
  VOICE_GATEWAY_KEY: "{{run.key}}"
  VOICE_SESSION: "{{run.session}}"
  VOICE_CHAT_MODEL: "openai/{{model}}"
  VOICE_STT_MODEL: openai/whisper-1
  VOICE_TTS_MODEL: openai/gpt-4o-mini-tts
  VOICE_TTS_VOICE: alloy
model: gpt-4o-mini
notes:
  project_file: AGENTS.md
mcp:
  format: env
budgets:
  wall_s: 420
  cpus: 1
  mem_gb: 1
gateway:
  provider: openai
  max_retries: 0
  # X8: the speech-to-text and text-to-speech models the run's key may also call.
  models: [whisper-1, gpt-4o-mini-tts]
