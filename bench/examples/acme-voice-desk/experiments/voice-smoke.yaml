# Free smoke check of the acme-voice-desk project: no model calls, no spend.
# The real pipeline runs with two scripted control agents on every task,
# clean condition, one trial: the helpdesk and the voice caller start, the
# agent's place is taken by the control, the helpdesk database, the call
# transcript, the call timeline and both audio tracks are exported, and the
# hidden state verifier grades them. Arm A runs each task's reference script
# (oracle: it answers the call and speaks in tone code), arm B does nothing
# (noop: it never dials the caller), so A must resolve 6 of 6 and B 0 of 6;
# anything else means the services, the call, the export or a verifier are
# wired wrong.
#
# `smoke: true` marks the runs as a synthetic smoke test: never findings.
# Slots: 6 tasks x 1 trial x 2 arms = 12.
name: voice-smoke
smoke: true
suite: acme-voice-desk@1.0.0
base: agents/oracle.yaml
arms:
  A: {label: oracle (reference script)}
  B: {label: noop (no call), agent: agents/noop.yaml}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 2
manifest_mode: agent_exposure
policy: policies/default.yaml
