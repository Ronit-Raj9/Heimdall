# Free smoke check of the acme-desktop project: no model calls, no spend.
# The real pipeline runs with two scripted control agents on every task,
# clean condition, one trial: the desktop service starts seeded, the tool
# proxy sits in front of its MCP server, the agent's place is taken by the
# control, the desktop's state is dumped and the hidden state verifier grades
# it. Arm A runs each task's reference script (oracle), which drives the
# desktop through the same MCP tools an agent gets; arm B does nothing
# (noop). A must verify 3 of 3 and B 0 of 3; anything else means the
# desktop, the proxy, the export or a verifier are wired wrong.
#
# `smoke: true` makes the planner only warn while the suite is not locked or
# a task is not admitted yet, and marks the runs as a synthetic smoke test.
# Slots: 3 tasks x 1 trial x 2 arms = 6.
name: desktop-smoke
smoke: true
suite: acme-desktop@1.0.0
base: agents/oracle.yaml
arms:
  A: {label: oracle (reference script)}
  B: {label: noop (no change), agent: agents/noop.yaml}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261115
concurrency: 2
manifest_mode: agent_exposure
policy: policies/default.yaml
