# Claude Code, headless, as a computer-use agent: it sees the desktop only
# through the desktop MCP server's screenshot tool (PNG image content, so the
# model must accept images) and acts through its click, type and key tools.
#
# Copied from the bench's agents/claude-code.yaml (see its comments for the
# launch pattern, auth and egress switches) with three changes for this suite:
# - mcp: the run's MCP servers (the desktop, through the per-run tool proxy) are
#   written into Claude Code's user-level config, $CLAUDE_CONFIG_DIR/.claude.json,
#   in its own "mcpServers" format. Any agent with an `mcp:` block (Codex:
#   codex_toml, OpenCode: opencode_json, your own: generic_json or env with
#   BENCH_MCP_SERVERS) can take this file's place.
# - the image is the bench's prebuilt bench/agent-claude-code:1 (build it in
#   the bench repository: docker build -t bench/agent-claude-code:1
#   agents/images/claude-code). It runs in its own image: the tasks need only
#   the desktop tools, not the suite's toolchain.
# - budgets: GUI work is slow (a screenshot, a look, one action), so the wall
#   budget is larger than for the support desk.
id: claude-code
adapter: command
# What this agent can do here: it drives the desktop through MCP tools.
capabilities: [desktop, shell, tools, mcp]
image: bench/agent-claude-code:1
argv:
  - claude
  - -p
  - --dangerously-skip-permissions
  - --output-format
  - stream-json
  - --verbose
  # Provider-side web tools would reach the internet past the internal
  # network and could fetch task answers, so they are switched off.
  - --disallowedTools
  - WebSearch,WebFetch
  - --model
  - "{{model}}"
  - "{{instruction}}"
env:
  ANTHROPIC_BASE_URL: "{{gateway.url}}/anthropic"
  ANTHROPIC_AUTH_TOKEN: "{{run.key}}"
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_MODEL: "{{model}}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "{{model}}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "{{model}}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{model}}"
  ANTHROPIC_CUSTOM_HEADERS: "x-bf-session-id: {{run.session}}\nx-bf-session-affinity: off"
  CLAUDE_CONFIG_DIR: /home/agent/.claude
  CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
  DISABLE_AUTOUPDATER: "1"
  DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_ERROR_REPORTING: "1"
mcp:
  format: claude_json
# Placeholder: every experiment sets the model (an arm may vary it).
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
  user_path: /home/agent/.claude/CLAUDE.md
parser: claudecode
budgets:
  wall_s: 1800
  cpus: 2
  mem_gb: 4
gateway:
  provider: anthropic
  max_retries: 0
