# Train the support desk's ticket router to 90.5% held-out accuracy on the
# GPU. Graded on the model file the agent leaves: the hidden verifier loads
# the weights (no agent code) into its own copy of the model class and
# scores them on held-out tickets drawn from a source only it has.
id: train-classifier
version: 1.0.0
title: Train the ticket router to 90.5% held-out accuracy on the GPU
project: ticket-router
kind: feature
instruction: instruction.md
repo_dir: repo
resources:
  # One whole GPU for the agent's session and the verifier. 2 GiB is far
  # more than the model needs; it keeps the task off cards that are smaller.
  gpu: {count: 1, min_vram_mb: 2048}
output:
  kind: artifact
  artifacts:
    - {id: model, path: model.pt, required: true, max_bytes: 67108864}
    - {id: config, path: model.json, required: true, max_bytes: 4096}
verifier:
  tests: verifier/tests
  required: []
protected: [model.py, train.npz]
controls:
  reference: solution/reference.sh
  empty: controls/empty.sh
  mutants: [controls/mutant-starter.sh, controls/mutant-wrong-config.sh]
  exploit: controls/exploit.sh
timeouts:
  # The session's wall budget is its GPU-time budget: the run holds the GPU
  # for exactly this long at most.
  agent_s: 900
capabilities: [ml_training, gpu]
difficulty: medium
provenance:
  source: bench/examples/acme-gpu (fictional Acme support desk; data generated by verifier/tests/gen.py)
  license: MIT
  created_by: hand-written example
