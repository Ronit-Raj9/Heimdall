# Make the churn model's training loop at least 2.5 times faster on the GPU
# without losing accuracy. Graded on the diff: the hidden verifier runs the
# original loop and the agent's on the same fresh data, in child processes
# it times itself, then scores both models on held-out points drawn after
# every child is gone.
id: fix-slow-loop
version: 1.0.0
title: Speed up the churn model's training loop on the GPU
project: churn-model
kind: performance
instruction: instruction.md
repo_dir: repo
resources:
  gpu: {count: 1, min_vram_mb: 2048}
verifier:
  tests: verifier/tests
  required: []
protected: [data.py, model.py]
controls:
  reference: solution/patch.diff
  empty: controls/empty.diff
  mutants: [controls/mutant-sync-only.diff, controls/mutant-two-epochs.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
capabilities: [ml_systems, performance, gpu]
difficulty: medium
provenance:
  source: bench/examples/acme-gpu (fictional Acme churn model; data generated by repo/data.py)
  license: MIT
  created_by: hand-written example
