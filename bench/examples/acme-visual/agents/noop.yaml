# Noop control: changes nothing and exits 0, so the page keeps its grey
# left-aligned button, no chart is written and the editor keeps its default
# layout: every task must fail.
# Scripted adapter: argv, env and files come from the adapter, not this file.
id: noop
adapter: scripted
image: bench/coding-core-base:1
scripted:
  kind: noop
model: claude-sonnet-4-5
notes:
  project_file: CLAUDE.md
budgets:
  wall_s: 600
  cpus: 1
  mem_gb: 1
gateway:
  provider: anthropic
  max_retries: 0
