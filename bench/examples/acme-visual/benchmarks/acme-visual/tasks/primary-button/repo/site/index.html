<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Account settings</h1>
      <p class="hint">Changes apply to every workspace you own.</p>
      <label>Display name <input value="Dana Whitfield" /></label>
      <label>Email <input value="dana@acme.example" /></label>
      <p class="saved">Last saved <span id="saved-at"></span></p>
      <div class="actions"><button class="primary" type="button">Save changes</button></div>
    </main>
    <script>
      document.getElementById("saved-at").textContent = new Date().toISOString();
    </script>
  </body>
</html>
