# Free smoke check of the acme-visual project: no model calls, no spend.
# The real pipeline runs with two scripted control agents on every task,
# clean condition, one trial. Arm A runs each task's reference script
# (oracle): it restyles the page, writes the chart or switches the editor's
# layout. Arm B does nothing (noop). After each run the bench captures the
# result itself (renders the page or the chart in the clean-room renderer,
# or screenshots the desktop through its own screenshot tool) and the visual
# grader checks it against the hidden reference. A must verify 3 of 3 and B
# 0 of 3; anything else means a capture, a reference or a check is wrong.
#
# `smoke: true` makes the planner only warn while the suite is not locked or
# a task is not admitted yet, and marks the runs as a synthetic smoke test.
# Slots: 3 tasks x 1 trial x 2 arms = 6.
name: visual-smoke
smoke: true
suite: acme-visual@1.0.0
base: agents/oracle.yaml
arms:
  A: {label: oracle (reference script)}
  B: {label: noop (no change), agent: agents/noop.yaml}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 1
manifest_mode: agent_exposure
policy: policies/default.yaml
