# W7 preset: the per-PR gate (docs/suite-tiers.md, docs/adaptive-trials.md).
# Runs the suite's `pr` tier (about 10 fast, discriminating tasks; propose
# one with `heimdall suite tiers suggest <suite> -max-minutes 10`), one trial
# per arm and a second only on tasks whose arms disagree (rule task): a task
# both arms pass, or both fail, costs two runs instead of four. It holds alpha
# like the fixed design but has less power than a fixed design of the same
# cost (docs/adaptive-trials.md, Simulation); for a PR gate the point is the
# cost cap. Replace the arms with your change. A pr tier under 6 tasks can
# never be IMPROVED or REGRESSED on the primary: it gates on guards, gates
# and instrument checks, and says INCONCLUSIVE otherwise.
name: pr-smoke
suite: coding-core@1.0.0
tier: pr
base: agents/claude-code.yaml
arms:
  A: {label: baseline}
  B: {label: candidate, set: {notes.user_file: experiments/fixtures/codewins.md}}
primary: {condition: clean, metric: verified_success}
guards:
  - {condition: clean, rule: no_regression}
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 2}
trials: {mode: adaptive, rule: task, min: 1, max: 2}
budget: {total_usd: 5}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 4
manifest_mode: agent_exposure
policy: policies/default.yaml
