# SYNTHETIC smoke run (DESIGN.md 19.1): the real pipeline with the scripted
# toy agent against the fault proxy's scripted model. Its results are never
# findings. The name starts with "smoke", so the planner only warns when the
# suite is not locked or a task is not admitted yet.
#
# Both arms are the toy agent. They differ only in the arm file, so the
# smoke run also exercises laying down notes.user_file. Slots: 2 tasks x
# (clean + model-outage) x 1 trial x 2 arms = 8.
name: smoke
suite: coding-core@1.0.0
base: agents/toy.yaml
arms:
  A: {label: toy baseline, set: {notes.user_path: /tmp/toy/CLAUDE.md}}
  B: {label: toy with code-wins note, set: {notes.user_path: /tmp/toy/CLAUDE.md, notes.user_file: experiments/fixtures/codewins.md}}
primary: {condition: clean, metric: verified_success}
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: [t01, t02], trials: 1}
  - {id: model-outage, tasks: [t01, t02], trials: 1}
budget: {total_usd: 0}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261114
concurrency: 2
manifest_mode: agent_exposure
