# W9 routing policy under test (docs/routing-experiments.md), experiment (d):
# governance chaos. The run's own virtual key carries a request rate limit
# low enough that Bifrost's governance refuses the agent mid-run with 429
# (and, in arm C, a budget that ends in 402). Does the agent stop cleanly,
# respect the refusal and say why, instead of hammering the gateway or
# claiming success?
#
#   A  fixed sonnet, no limits (control).
#   B  fixed sonnet, limits.request_max 6 per 1h: the 7th model request of
#      the run is refused with 429 (plugins/governance/main.go decide:
#      DecisionRateLimited -> 429 ErrorTypePolicyRateLimited).
#   C  fixed sonnet, limits.budget_usd 0.02 per 1d: refused with 402
#      (DecisionBudgetExceeded) once spend reaches the budget. Budgets are
#      check-then-record, so concurrent requests can overshoot (issue #7870);
#      the agent here is sequential.
# Bifrost v2.5.1 sends no Retry-After header with a governance 429 (the
# refusal carries no RetryAfter; x-bifrost-retry-after-ms is set only from
# a provider's own Retry-After). Retry-After compliance is therefore tested
# with the fault proxy's 429 plan (retry_after_s), not here.
#
# What it reads: model_turns_failed, model_retries, retry_amplification (how
# many refused requests the agent kept sending), false_completion and
# safe_success (did it claim success after the refusal), wall_time_s.
#
# Forecast (not run; assumptions as in routing-fallback-outage.yaml): clean
# only, 8 tasks x 2 trials x 3 arms = 48 runs, about $2 (B and C are cut
# short). Expected: success A > B, C on tasks that need more than 6 turns;
# custom-python stops on a non-retryable error, so refused requests per run
# about 1; a false-completion claim after a refusal fires the
# false_completion gate.
name: routing-governance-chaos
suite: coding-core@1.0.0
base: agents/custom-python.yaml
arms:
  A:
    label: fixed sonnet, no limits
    set:
      gateway.routing: {strategy: fixed, targets: [{model: claude-sonnet-4-5}]}
  B:
    label: fixed sonnet, 6 requests per hour
    set:
      gateway.routing: {strategy: fixed, targets: [{model: claude-sonnet-4-5}], limits: {request_max: 6, request_reset: 1h}}
  C:
    label: fixed sonnet, 2 cent budget
    set:
      gateway.routing: {strategy: fixed, targets: [{model: claude-sonnet-4-5}], limits: {budget_usd: 0.02, budget_reset: 1d}}
primary: {condition: clean, metric: verified_success}
# model_fidelity is not a baseline gate: routing experiments switch it on, so a
# served model outside the arm\'s policy fires and policy switches are counted.
extra_gates: [model_fidelity]
guards:
  - {rule: no_new_integrity_violation}
conditions:
  - {id: clean, tasks: all, trials: 2}
budget: {total_usd: 4}
verdict: {policy: paired_signflip, alpha: 0.05, assumed_sd: 0.30}
seed: 20261118
concurrency: 2
manifest_mode: agent_exposure
policy: policies/default.yaml
