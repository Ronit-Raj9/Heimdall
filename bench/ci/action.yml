name: Heimdall evaluation
description: >
  Test your agent on every pull request. Evaluate mode (the default) calls
  your hosted Heimdall with an org API token: it registers the pull request's
  agent config as a new version, evaluates it against the live version,
  posts the report card summary as one pull-request comment, sets the commit
  status and fails the job when the evaluation gate fails. Recorded and live
  modes run `bifrost-bench check` on a sealed bundle or a local bench stack.

inputs:
  mode:
    description: "evaluate (hosted Heimdall), recorded (re-analyze a sealed bundle you name) or live (run an experiment against a running stack)"
    required: false
    default: evaluate
  url:
    description: "evaluate: your Heimdall address, e.g. https://heimdall.example.com (usually vars.HEIMDALL_URL)"
    required: false
    default: ""
  token:
    description: "evaluate: an org API token from Heimdall (Settings > API tokens); pass secrets.HEIMDALL_TOKEN, never a literal"
    required: false
    default: ""
  agent:
    description: "evaluate: the agent id on your Heimdall"
    required: false
    default: ""
  config:
    description: "evaluate: the agent config file in this repository, registered as the pull request's version"
    required: false
    default: ""
  image:
    description: "evaluate: instead of a config file, an image this workflow built (ref@sha256:...): the live config with this image"
    required: false
    default: ""
  endpoint:
    description: "evaluate: instead of a config file, a preview deployment URL: the live config with this remote endpoint"
    required: false
    default: ""
  baseline:
    description: "evaluate: version to compare with, live (the agent's saved config) or a version number"
    required: false
    default: live
  model:
    description: "evaluate: model for both versions; empty uses each version's own model"
    required: false
    default: ""
  pack:
    description: "evaluate: benchmark pack, e.g. coding"
    required: false
    default: ""
  benchmarks:
    description: "evaluate: comma-separated benchmark ids (with or instead of pack)"
    required: false
    default: ""
  faults:
    description: "evaluate: comma-separated faults besides clean: model-down, broken-tool, misleading-instruction"
    required: false
    default: ""
  trials:
    description: "evaluate: repeats per task; empty uses the server default"
    required: false
    default: ""
  tasks:
    description: "evaluate: tasks per benchmark; empty uses the server default"
    required: false
    default: ""
  budget-usd:
    description: "evaluate: spend cap of the evaluation in USD; empty uses the server default"
    required: false
    default: ""
  max-score-drop:
    description: "evaluate: fail when a benchmark's score falls by more than this (0.05 = 5 points); empty is off"
    required: false
    default: ""
  max-cost-increase:
    description: "evaluate: fail when total cost grows by more than this fraction (0.25 = 25%); empty is off"
    required: false
    default: ""
  timeout:
    description: "evaluate: how long to wait for the evaluation"
    required: false
    default: 3h
  github-token:
    description: "evaluate: token for the pull request comment and commit status"
    required: false
    default: ${{ github.token }}
  experiment:
    description: "live: experiment file, relative to bench/ (e.g. experiments/codewins.reduced.yaml)"
    required: false
    default: ""
  exp-id:
    description: "recorded: experiment id inside the bundle; empty uses the only one"
    required: false
    default: ""
  bundle:
    description: "recorded: your bundle root, relative to the project folder (BENCH_CI_BENCH_DIR, else bench/). Required in recorded mode: there is no default bundle"
    required: false
    default: ""
  data-mode:
    description: "recorded: the mode the report is labelled with, recorded or synthetic (use synthetic for a scripted-model bundle)"
    required: false
    default: recorded
  policy:
    description: "release policy file, relative to bench/; empty uses policies/default.yaml when it exists; none turns policy off, including the policy the experiment froze. Ignored, with a warning, by a bifrost-bench without -policy"
    required: false
    default: ""
  fail-on:
    description: "comma-separated outcomes that fail the gate; empty uses regressed,failed (evaluate) or regressed,invalid (recorded, live)"
    required: false
    default: ""
  go-version:
    description: "Go version; empty uses the go directive of bench/go.mod"
    required: false
    default: ""
  artifact-name:
    description: "name of the uploaded report artifact"
    required: false
    default: heimdall-report
  bin:
    description: "path of a prebuilt bifrost-bench (or heimdall) binary; empty builds one from this checkout. Set BENCH_CI_BENCH_DIR in the step env to run in another project folder (heimdall ci install does both)"
    required: false
    default: ""

outputs:
  outcome:
    description: "evaluate: improved, same, inconclusive, regressed, failed or no-change"
    value: ${{ steps.evaluate.outputs.outcome }}
  evaluation:
    description: "evaluate: the evaluation id on your Heimdall"
    value: ${{ steps.evaluate.outputs.evaluation }}
  report-url:
    description: "evaluate: the report card on your Heimdall"
    value: ${{ steps.evaluate.outputs.report-url }}
  version:
    description: "evaluate: the agent version the pull request registered"
    value: ${{ steps.evaluate.outputs.version }}
  verdict:
    description: "improved, regressed, inconclusive, invalid, or none when check stopped before a verdict"
    value: ${{ steps.check.outputs.verdict }}
  action:
    description: "ship, hold, no_decision, fix_harness, or none"
    value: ${{ steps.check.outputs.action }}
  policy-decision:
    description: "allow, warn or block when a policy was evaluated, else empty"
    value: ${{ steps.check.outputs.policy-decision }}
  exit-code:
    description: "bifrost-bench check exit code: 0 pass, 1 regressed, 2 inconclusive, 3 invalid, 4 infrastructure, 5 policy block, 64 usage"
    value: ${{ steps.check.outputs.gate || steps.evaluate.outputs.gate }}
  report:
    description: "path of the markdown report on the runner (report.json sits beside it)"
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    # The bundle is resolved once, against the project folder the gate runs
    # in (BENCH_CI_BENCH_DIR, else this bench module), so the seal guard and
    # the gate read the same files (QC2-22-08).
    - name: Locate the bench module
      id: paths
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BUNDLE: ${{ inputs.bundle }}
        MODE: ${{ inputs.mode }}
      run: |
        case $MODE in
          evaluate|recorded|live) ;;
          *) echo "::error title=Heimdall::mode $MODE: want evaluate, recorded or live"; exit 64 ;;
        esac
        # No fixture default: recorded mode re-checks only the bundle you name.
        if [ "$MODE" = recorded ] && [ -z "$BUNDLE" ]; then
          echo "::error title=Heimdall::recorded mode needs the bundle input (a folder of sealed experiments)"
          exit 64
        fi
        bench=$(cd "$GITHUB_ACTION_PATH/.." && pwd)
        project=$(cd "${BENCH_CI_BENCH_DIR:-$bench}" && pwd)
        bundle=""
        case $BUNDLE in
          "") ;;
          /*) bundle=$BUNDLE ;;
          *) bundle="$project/$BUNDLE" ;;
        esac
        echo "bench=$bench" >> "$GITHUB_OUTPUT"
        echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', steps.paths.outputs.bench) || '' }}
        cache-dependency-path: ${{ steps.paths.outputs.bench }}/go.sum
        # With a prebuilt binary the caller already set up Go and restored the
        # module cache; a second restore into the same GOMODCACHE makes tar
        # report thousands of "Cannot open: File exists" errors (seen on
        # GitHub, test #18).
        cache: ${{ inputs.bin == '' }}

    - name: Build bifrost-bench
      id: build
      shell: bash
      working-directory: ${{ steps.paths.outputs.bench }}
      env:
        GOWORK: "off"
        CGO_ENABLED: "0"
        PREBUILT: ${{ inputs.bin }}
      run: |
        if [ -n "$PREBUILT" ]; then
          echo "bin=$PREBUILT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        bin="$RUNNER_TEMP/bifrost-bench-bin/bifrost-bench"
        go build -o "$bin" ./cmd/bifrost-bench
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    # Bundle-wide verification: every seal of every experiment in the bundle
    # and each seals.log chain, not only the runs the selected analysis
    # counts (check -exp verifies those itself). A hand-edited bundle fails here.
    - name: Verify recorded bundle seals
      if: inputs.mode == 'recorded'
      shell: bash
      working-directory: ${{ steps.paths.outputs.bench }}
      env:
        GOWORK: "off"
        BENCH_CI_BUNDLE: ${{ steps.paths.outputs.bundle }}
      run: go test -count=1 -run 'TestRecordedBundleSeals' ./ci/

    # The step always succeeds so its outputs are set and the report is
    # uploaded; the last step carries the gate's exit code.
    - name: Run bifrost-bench check
      id: check
      if: inputs.mode != 'evaluate'
      shell: bash
      env:
        BENCH_CI_MODE: ${{ inputs.mode }}
        BENCH_CI_BIN: ${{ steps.build.outputs.bin }}
        BENCH_CI_EXPERIMENT: ${{ inputs.experiment }}
        BENCH_CI_EXP_ID: ${{ inputs.exp-id }}
        BENCH_CI_BUNDLE: ${{ steps.paths.outputs.bundle }}
        BENCH_CI_DATA_MODE: ${{ inputs.data-mode }}
        BENCH_CI_POLICY: ${{ inputs.policy }}
        BENCH_CI_FAIL_ON: ${{ inputs.fail-on || 'regressed,invalid' }}
        BENCH_CI_OUT: ${{ runner.temp }}/bench-check/report.md
      run: |
        code=0
        "$GITHUB_ACTION_PATH/check.sh" || code=$?
        echo "gate=$code" >> "$GITHUB_OUTPUT"

    # Evaluate mode: every input reaches `ci evaluate` as a HEIMDALL_*
    # variable, so no value is spliced into a shell command line. The step
    # always succeeds so the outputs are set; the last step carries the gate.
    - name: Evaluate on Heimdall
      id: evaluate
      if: inputs.mode == 'evaluate'
      shell: bash
      env:
        BIN: ${{ steps.build.outputs.bin }}
        HEIMDALL_URL: ${{ inputs.url }}
        HEIMDALL_TOKEN: ${{ inputs.token }}
        HEIMDALL_AGENT: ${{ inputs.agent }}
        HEIMDALL_CONFIG: ${{ inputs.config }}
        HEIMDALL_IMAGE: ${{ inputs.image }}
        HEIMDALL_ENDPOINT: ${{ inputs.endpoint }}
        HEIMDALL_BASELINE: ${{ inputs.baseline }}
        HEIMDALL_MODEL: ${{ inputs.model }}
        HEIMDALL_PACK: ${{ inputs.pack }}
        HEIMDALL_BENCHMARKS: ${{ inputs.benchmarks }}
        HEIMDALL_FAULTS: ${{ inputs.faults }}
        HEIMDALL_TRIALS: ${{ inputs.trials }}
        HEIMDALL_TASKS: ${{ inputs.tasks }}
        HEIMDALL_BUDGET_USD: ${{ inputs.budget-usd }}
        HEIMDALL_MAX_SCORE_DROP: ${{ inputs.max-score-drop }}
        HEIMDALL_MAX_COST_INCREASE: ${{ inputs.max-cost-increase }}
        HEIMDALL_FAIL_ON: ${{ inputs.fail-on || 'regressed,failed' }}
        HEIMDALL_TIMEOUT: ${{ inputs.timeout }}
        HEIMDALL_OUT: ${{ runner.temp }}/heimdall-evaluate
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        code=0
        "$BIN" ci evaluate || code=$?
        echo "gate=$code" >> "$GITHUB_OUTPUT"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/bench-check/report.md
          ${{ runner.temp }}/bench-check/report.json
          ${{ runner.temp }}/heimdall-evaluate/
        if-no-files-found: warn

    - name: Gate
      shell: bash
      env:
        GATE: ${{ steps.check.outputs.gate || steps.evaluate.outputs.gate }}
      run: exit "${GATE:-4}"
