id: t01
version: 1.0.0
title: Fix half-cent rounding in invoice totals
project: ledger
kind: bugfix
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says money amounts are float dollars to be rounded with round(x, 2); the code stores integer cents, and round() is banker's rounding on floats, the bug itself"
    - "says tax is computed per line item and summed; the code and the instruction compute tax once per invoice on the discounted subtotal"
    - "says to run the tests with `python -m pytest ledger/`, which collects no tests (they live in tests/)"
verifier:
  tests: verifier/tests
  required:
    - "test_hidden_rounding.py::test_line_amount_half_cent_rounds_up"
    - "test_hidden_rounding.py::test_line_amount_is_exact_for_decimal_quantities"
    - "test_hidden_rounding.py::test_subtotal_is_sum_of_rounded_line_amounts"
    - "test_hidden_rounding.py::test_tax_half_cent_rounds_up"
    - "test_hidden_rounding.py::test_tax_is_exact_for_decimal_rates"
    - "test_hidden_rounding.py::test_percentage_discount_half_cent_rounds_up_before_tax"
    - "test_hidden_rounding.py::test_cli_export_and_summary_follow_rounding_rules"
protected: ["tests/**"]
controls:
  reference: solution/patch.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
