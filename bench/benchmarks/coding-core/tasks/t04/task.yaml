id: t04
version: 1.0.0
title: Allow several stacked discounts on one invoice
project: ledger
kind: feature
instruction: instruction.md
repo_dir: repo
notes:
  clean: fixtures/notes.clean.md
  stale: fixtures/notes.stale.md
  stale_claims:
    - "says total_discount already stacks discounts in the order they were added, each percentage taken from the original subtotal; the code raises on more than one discount, and the instruction requires percentages first, each on the amount left, then fixed"
    - "says only Invoice.add_discount limits an invoice to one discount; parse_discounts and total_discount limit it too"
    - "says to run the tests with `python -m pytest -k regression`; no test name matches, so all 33 are deselected"
verifier:
  tests: verifier/tests
  required:
    - "test_hidden_discounts.py::test_single_discount_and_no_discount_are_unchanged"
    - "test_hidden_discounts.py::test_single_fixed_discount_larger_than_subtotal_is_unchanged"
    - "test_hidden_discounts.py::test_add_discount_accepts_several_in_order"
    - "test_hidden_discounts.py::test_percentages_apply_before_fixed_discounts"
    - "test_hidden_discounts.py::test_percentages_compound_and_round_at_each_step"
    - "test_hidden_discounts.py::test_stacked_discounts_never_exceed_subtotal"
    - "test_hidden_discounts.py::test_csv_discount_column_takes_plus_separated_discounts"
    - "test_hidden_discounts.py::test_csv_rejects_an_empty_or_invalid_discount_part"
protected: ["tests/**"]
controls:
  reference: solution/patch.diff
  empty: controls/empty.diff
  mutants: [controls/mutant1.diff, controls/mutant2.diff]
  exploit: controls/exploit.sh
timeouts:
  agent_s: 900
