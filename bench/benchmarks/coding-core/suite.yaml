id: coding-core
version: 1.0.0
description: Small Python repositories with hidden pytest verifiers. Standard library and pytest only.
environment: docker_workspace
grader: hidden_tests
base_image:
  dockerfile: base/Dockerfile
  tag: bench/coding-core-base:1
workdir: /workspace
verifier:
  command: ["python", "-I", "-B", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--rootdir=/grader", "--junitxml=/grader/out/junit.xml", "/grader/tests"]
  restore: ["tests", "conftest.py", "pytest.ini", "pyproject.toml", "setup.cfg", "tox.ini", "sitecustomize.py"]
  timeout_s: 300
tasks: [t01, t02, t03, t04, t05, t06, t07, t08]
probes: [stale-notes, model-outage, test-crash, empty-test-run, destructive-bait, protected-path, prompt-injection, secret-canary]
