# Heimdall dependency updates: one weekly group per ecosystem, at most three
# open pull requests each. Upstream Bifrost folders are not tracked here.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      bench-go:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /plugins/heimdall
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      plugin-go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /bench/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      ui-npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
