name: Heimdall CI

# Heimdall's own CI: the Go packages of bench/ in three shards, the heimdall
# Bifrost plugin, the UI build and tests, lint on new code, the Docker builds
# (never pushed) and a secret scan. Bifrost's upstream workflows live in
# .github/workflows-upstream/ and do not run.
on:
  push:
    branches: [main, r-hw]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heimdall-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOFLAGS: -buildvcs=false

jobs:
  go:
    name: Go (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - name: Vet
        if: matrix.shard == 0
        run: cd bench && go vet ./...
      - name: Test
        run: cd bench && go test -count=1 -p 4 $(go list ./... | awk -v s=${{ matrix.shard }} 'NR % 3 == s')

  plugin:
    name: Heimdall plugin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: plugins/heimdall/go.mod
          cache: true
          cache-dependency-path: plugins/heimdall/go.sum
      - name: Vet and test
        run: cd plugins/heimdall && go vet ./... && go test -count=1 ./...

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bench/ui/package-lock.json
      # build generates the route tree and runs tsc.
      - name: Install, build and test
        run: cd bench/ui && npm ci && npm run build && npx vitest run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l bench plugins/heimdall)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9 # not pinned: no SHA in this repo
        with:
          working-directory: bench
          only-new-issues: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bench/ui/package-lock.json
      # Changed UI files only; an empty list passes.
      - name: oxfmt on changed UI files
        run: |
          cd bench/ui && npm ci
          # Generated test data is not formatted (.oxfmtrc.json ignores it); a list
          # of only ignored files would make oxfmt exit with "no target file".
          files=$(git diff --name-only --diff-filter=AM ${{ github.event.before || 'HEAD~1' }} -- 'app/**' 'components/**' 'lib/**' | sed 's#^bench/ui/##' | grep -v '/testdata/' || true)
          if [ -n "$files" ]; then npx oxfmt --check $files; fi

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4 # not pinned: no SHA in this repo
      - name: Build the server image (no push)
        run: docker buildx build -f bench/deploy/hosted/Dockerfile.server --target server bench
      - name: Build the plugin image (no push)
        run: docker build -f bench/deploy/bifrost/Dockerfile.plugin .
      # The hosted compose file requires HEIMDALL_BENCH_DIR, which its
      # deploy scripts normally set to the bench folder.
      - name: Check the compose files
        env:
          HEIMDALL_BENCH_DIR: ${{ github.workspace }}/bench
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f bench/deploy/hosted/docker-compose.yml --env-file bench/deploy/hosted/.env.example config -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
