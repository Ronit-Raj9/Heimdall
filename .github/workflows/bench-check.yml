name: Heimdall gate

# The agent release gate of Bifrost Bench (bench/docs/ci.md). Every pull
# request that changes an agent (its config, prompt, notes file, model or
# tools), an experiment, a release policy, a benchmark or the bench code runs
# `bifrost-bench check` through the composite action in bench/ci. A verdict
# listed in fail-on, or a release-policy block, fails the build.
#
# The recorded job replays a sealed, checked-in experiment: no Docker, no
# gateway, no provider key and no secret. The live job at the bottom runs a
# real experiment on a self-hosted runner and is commented out.
on:
  push:
    branches: [main, r-hw]
  pull_request:
    paths:
      - "bench/agents/**"
      - "bench/experiments/**"
      - "bench/policies/**"
      - "bench/benchmarks/**"
      - "bench/**/*.go"
      - "bench/ci/**"
      - "bench/testdata/recorded/**"
      - ".github/workflows/bench-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recorded:
    name: Agent gate (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The bundle holds a REAL run: e_pilot_mixed_nc93, Codex CLI against the
      # custom-python agent on gpt-5.4-mini through Bifrost v2.5.1, clean and
      # under all three PS2 failure families (see
      # bench/testdata/recorded/README.md). The synthetic smoke run
      # e_smoke_sdoj stays in the bundle as a no-key example. policy left
      # empty uses bench/policies/default.yaml: small samples warn, real
      # failures block (exit 5); "none" gates on the verdict only.
      - name: Bifrost Bench gate
        id: gate
        uses: ./bench/ci
        with:
          mode: recorded
          bundle: testdata/recorded
          exp-id: e_pilot_mixed_nc93
          data-mode: recorded
          policy: ""
          fail-on: regressed,invalid

